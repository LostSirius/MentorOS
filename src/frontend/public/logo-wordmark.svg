<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" role="img" aria-labelledby="title">
  <title id="title">MentorOS</title>
  <defs>
    <linearGradient id="os" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09b9bd"/>
      <stop offset="1" stop-color="#078b9b"/>
    </linearGradient>
    <style>
      .mentor { fill: #071d43; }
      @media (prefers-color-scheme: dark) {
        .mentor { fill: #e9f6f6; }
      }
    </style>
  </defs>
  <text x="8" y="130" class="mentor"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="128" font-weight="700" letter-spacing="-7">Mentor</text>
  <text x="560" y="130" fill="url(#os)"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="128" font-weight="600" letter-spacing="-7">OS</text>
</svg>
