<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor-Skills 科研导师</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header img {
      width: 36px; height: 36px; border-radius: 8px;
    }
    .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
    .header .subtitle { font-size: 12px; color: #888; margin-left: auto; }
    .main { flex: 1; display: flex; overflow: hidden; }
    .sidebar {
      width: 260px; background: #141414; border-right: 1px solid #333;
      padding: 16px; overflow-y: auto;
    }
    .sidebar h3 { font-size: 13px; color: #888; text-transform: uppercase; margin-bottom: 12px; }
    .skill-btn {
      width: 100%; padding: 10px 12px; margin-bottom: 6px;
      background: #1f1f1f; border: 1px solid #333; border-radius: 8px;
      color: #e0e0e0; font-size: 13px; cursor: pointer; text-align: left;
      transition: all 0.2s;
    }
    .skill-btn:hover { background: #2a2a2a; border-color: #555; }
    .skill-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; }
    .message { max-width: 800px; margin: 0 auto 20px; display: flex; gap: 12px; }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold;
    }
    .message.assistant .avatar { background: #2563eb; color: #fff; }
    .message.user .avatar { background: #444; color: #fff; }
    .bubble {
      padding: 12px 16px; border-radius: 12px; line-height: 1.6;
      font-size: 14px; white-space: pre-wrap;
    }
    .message.assistant .bubble { background: #1f1f1f; border: 1px solid #333; }
    .message.user .bubble { background: #2563eb; color: #fff; }
    .input-area {
      border-top: 1px solid #333; padding: 16px 24px; background: #1a1a1a;
    }
    .input-box {
      max-width: 800px; margin: 0 auto;
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-box textarea {
      flex: 1; background: #0f0f0f; border: 1px solid #333; border-radius: 10px;
      padding: 12px 16px; color: #e0e0e0; font-size: 14px; resize: none;
      min-height: 48px; max-height: 160px; outline: none;
    }
    .input-box textarea:focus { border-color: #555; }
    .input-box button {
      padding: 10px 20px; background: #2563eb; border: none; border-radius: 10px;
      color: #fff; font-size: 14px; cursor: pointer; transition: background 0.2s;
    }
    .input-box button:hover { background: #1d4ed8; }
    .input-box button:disabled { background: #333; cursor: not-allowed; }
    .typing { display: flex; gap: 4px; padding: 12px 16px; }
    .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .skill-tag {
      display: inline-block; padding: 2px 8px; background: #2563eb33;
      border: 1px solid #2563eb66; border-radius: 4px; font-size: 11px;
      color: #60a5fa; margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="width:36px;height:36px;background:#2563eb;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;">🎓</div>
    <div>
      <h1>Supervisor-Skills 科研导师</h1>
    </div>
    <div class="subtitle">HKUST Dial Lab</div>
  </div>

  <div class="main">
    <div class="sidebar">
      <h3>选择技能</h3>
      <button class="skill-btn active" data-skill="">默认对话</button>
      <button class="skill-btn" data-skill="idea-evaluator">💡 Idea Evaluator</button>
      <button class="skill-btn" data-skill="intro-drafter">📝 Introduction Drafter</button>
      <button class="skill-btn" data-skill="tech-paper-template">🔬 Tech Paper Template</button>
      <button class="skill-btn" data-skill="benchmark-paper-template">📊 Benchmark Paper</button>
      <button class="skill-btn" data-skill="figure-designer">🎨 Figure Designer</button>
      <button class="skill-btn" data-skill="pre-submission-reviewer">🔍 Pre-Submission Reviewer</button>
      <button class="skill-btn" data-skill="vibe-research-workflow">⚡ Vibe Research</button>

      <h3 style="margin-top:24px">使用提示</h3>
      <p style="font-size:12px;color:#666;line-height:1.6">
        点击左侧技能按钮切换科研导师模式。<br><br>
        在输入框中描述你的研究问题，AI 将自动加载对应的 SKILL.md 文件并执行评估流程。
      </p>
    </div>

    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="描述你的研究问题..."></textarea>
          <button id="send">发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let currentSkill = '';

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    // Skill selection
    document.querySelectorAll('.skill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSkill = btn.dataset.skill;
        if (currentSkill) {
          addMessage('assistant', `已切换到 **${btn.textContent.trim()}** 模式。请描述你的研究内容，我将按照该 skill 的流程为你提供结构化输出。`);
        }
      });
    });

    function addMessage(role, content, isHtml = false) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      const avatar = role === 'assistant' ? 'AI' : '你';
      div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">${isHtml ? content : escapeHtml(content)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code style="background:#333;padding:2px 4px;border-radius:4px;">$1</code>');
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message assistant typing-indicator';
      div.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage('user', text);
      sendBtn.disabled = true;

      const skillPrefix = currentSkill ? `Use ${currentSkill} to ` : '';
      const finalMessage = currentSkill ? `${skillPrefix}${text}` : text;

      const typing = showTyping();
      const assistantBubble = typing.querySelector('.bubble');

      try {
        const response = await fetch('/api/chat/supervisor-skills', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chatSettings: { model: 'supervisor-skills', temperature: 0.7 },
            messages: [{ role: 'user', content: finalMessage }]
          })
        });

        typing.remove();

        if (!response.ok) {
          const err = await response.json();
          addMessage('assistant', `错误: ${err.message || '请求失败'}`);
          return;
        }

        const assistantDiv = addMessage('assistant', '');
        const assistantBubble = assistantDiv.querySelector('.bubble');
        let fullText = '';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) {
                  fullText += content;
                  assistantBubble.innerHTML = escapeHtml(fullText);
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        typing.remove();
        addMessage('assistant', `错误: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Welcome message
    addMessage('assistant', '你好！我是你的 AI 科研副导师，基于 Supervisor-Skills 项目构建。\n\n请从左侧选择一个技能，或直接告诉我你的研究问题。');
  </script>
</body>
</html>
