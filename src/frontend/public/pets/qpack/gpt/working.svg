<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <path id="gpt-knot-segment-base" d="M128 168h14l9 9v12h-8v-9l-5-4h-10"/>
    <g id="gpt-knot-shape-base">
      <use href="#gpt-knot-segment-base"/>
      <use href="#gpt-knot-segment-base" transform="rotate(60 128 188)"/>
      <use href="#gpt-knot-segment-base" transform="rotate(120 128 188)"/>
      <use href="#gpt-knot-segment-base" transform="rotate(180 128 188)"/>
      <use href="#gpt-knot-segment-base" transform="rotate(240 128 188)"/>
      <use href="#gpt-knot-segment-base" transform="rotate(300 128 188)"/>
    </g>
      <style>
      #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 160px}
      #working-pose-js{animation:gpt-working-pose 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 160px}
      #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
      #working-gaze-js{animation:gpt-working-gaze 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 160px}
      #blink-js{animation:gpt-working-blink 3200ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #head-work-js{animation:gpt-working-head 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 140px}
      #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 235px}
      #shadow-pulse-js{animation:gpt-working-shadow 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      .is-restarting *{animation:none!important}
      #left-arm-work-js{animation:gpt-working-left-arm 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:64px 176px}
      #right-arm-work-js{animation:gpt-working-right-arm 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:192px 176px}
      #knot-core-js{animation:gpt-working-core 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 188px}
      #knot-glow-js{animation:gpt-working-glow 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 188px}
      @keyframes gpt-working-pose{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(-1px) rotate(-.2deg)}25%{transform:translateY(0) rotate(.2deg)}38%{transform:translateY(-2px) rotate(-.2deg)}50%{transform:translateY(0) rotate(.2deg)}63%{transform:translateY(-1px) rotate(-.2deg)}78%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes gpt-working-head{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(1px) rotate(.2deg)}25%{transform:translateY(0) rotate(-.2deg)}38%{transform:translateY(1px) rotate(.2deg)}50%{transform:translateY(0) rotate(-.2deg)}63%{transform:translateY(1px) rotate(.2deg)}78%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes gpt-working-gaze{0%{transform:translate(0,0)}12%{transform:translate(0,1px)}25%{transform:translate(.4px,1.2px)}38%{transform:translate(-.4px,1.2px)}50%{transform:translate(.4px,1.2px)}63%{transform:translate(-.4px,1.2px)}78%{transform:translate(0,0)}100%{transform:translate(0,0)}}
      @keyframes gpt-working-blink{0%{transform:scaleY(1)}12%{transform:scaleY(1)}25%{transform:scaleY(1)}38%{transform:scaleY(1)}50%{transform:scaleY(1)}63%{transform:scaleY(1)}78%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
      @keyframes gpt-working-left-arm{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(3px) rotate(3deg)}25%{transform:translateY(-2px) rotate(-2deg)}38%{transform:translateY(3px) rotate(3deg)}50%{transform:translateY(-2px) rotate(-2deg)}63%{transform:translateY(3px) rotate(3deg)}78%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes gpt-working-right-arm{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(-2px) rotate(2deg)}25%{transform:translateY(3px) rotate(-3deg)}38%{transform:translateY(-2px) rotate(2deg)}50%{transform:translateY(3px) rotate(-3deg)}63%{transform:translateY(-2px) rotate(2deg)}78%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes gpt-working-core{0%{transform:rotate(0);opacity:.84}12%{transform:rotate(8deg);opacity:.9}25%{transform:rotate(16deg);opacity:.96}38%{transform:rotate(24deg);opacity:1}50%{transform:rotate(30deg);opacity:1}63%{transform:rotate(22deg);opacity:.94}78%{transform:rotate(10deg);opacity:.88}100%{transform:rotate(0);opacity:.84}}
      @keyframes gpt-working-glow{0%{transform:rotate(0);opacity:.08}12%{transform:rotate(-4deg);opacity:.14}25%{transform:rotate(-8deg);opacity:.2}38%{transform:rotate(-12deg);opacity:.26}50%{transform:rotate(-15deg);opacity:.3}63%{transform:rotate(-11deg);opacity:.18}78%{transform:rotate(-5deg);opacity:.12}100%{transform:rotate(0);opacity:.08}}
      @keyframes gpt-working-shadow{0%{transform:scaleX(1);opacity:.22}12%{transform:scaleX(1.01);opacity:.23}25%{transform:scaleX(.99);opacity:.21}38%{transform:scaleX(1.02);opacity:.23}50%{transform:scaleX(.99);opacity:.21}63%{transform:scaleX(1.01);opacity:.23}78%{transform:scaleX(1);opacity:.22}100%{transform:scaleX(1);opacity:.22}}
    </style>
  </defs>

  <g id="shadow-js" opacity="0.22">
    <ellipse id="shadow-pulse-js" cx="128" cy="235" rx="48" ry="6" fill="#131721"/>
  </g>

  <g id="pointer-body-js" shape-rendering="crispEdges">
    <g id="float-js">
      <g id="working-pose-js">
      <g id="arms-js">
        
        <g id="left-arm-work-js"><path d="M58 156h8v-8h10v48h-10v8H52v-28h4v-16h2z" fill="#323844"/>
        <path d="M52 184h14v20H52z" fill="#a9ead0"/>
        </g>
        
        <g id="right-arm-work-js"><path d="M198 156h-8v-8h-10v48h10v8h14v-28h-4v-16h-2z" fill="#323844"/>
        <path d="M190 184h14v20h-14z" fill="#a9ead0"/>
        </g>
        <path d="M58 164h8v20h-8zM190 164h8v20h-8z" fill="#4a5260" opacity="0.7"/>
      </g>

      <g id="body-js">
