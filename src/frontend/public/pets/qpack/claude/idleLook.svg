<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <style>
      #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 158px}
      #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
      #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 232px}
      .is-restarting *{animation:none!important}
      #float-js{animation:claude-idle-float 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 158px}
      #idle-look-pose-js{animation:claude-idle-look-pose 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 158px}
      #top-tuft-js{animation:claude-idle-look-tuft 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 96px}
      #arms-js{animation:claude-idle-arms 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 164px}
      #idle-look-gaze-js{animation:claude-idle-look-gaze 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 138px}
      #blink-js{animation:claude-idle-look-blink 4000ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #shadow-pulse-js{animation:claude-idle-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #shadow-idle-look-js{animation:claude-idle-look-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      @keyframes claude-idle-float{0%{transform:translateY(0)}20%{transform:translateY(-2px)}40%{transform:translateY(-5px)}60%{transform:translateY(-3px)}76%{transform:translateY(0)}79%{transform:translateY(1px)}82%{transform:translateY(.5px)}100%{transform:translateY(0)}}
      @keyframes claude-idle-arms{0%{transform:translateY(0)}20%{transform:translateY(-.5px)}40%{transform:translateY(-1px)}60%{transform:translateY(.5px)}76%{transform:translateY(.5px)}79%{transform:translateY(1px)}82%{transform:translateY(.5px)}100%{transform:translateY(0)}}
      @keyframes claude-idle-shadow{0%{transform:scaleX(1)}20%{transform:scaleX(.97)}40%{transform:scaleX(.92)}60%{transform:scaleX(.96)}76%{transform:scaleX(1.01)}79%{transform:scaleX(1.04)}82%{transform:scaleX(1.02)}100%{transform:scaleX(1)}}
      @keyframes claude-idle-look-pose{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(0,0) rotate(0)}32%{transform:translate(.4px,-.2px) rotate(.2deg)}46%{transform:translate(.8px,-.4px) rotate(.4deg)}58%{transform:translate(.8px,-.4px) rotate(.4deg)}70%{transform:translate(.8px,-.4px) rotate(.4deg)}84%{transform:translate(.25px,-.12px) rotate(.12deg)}100%{transform:translate(0,0) rotate(0)}}
      @keyframes claude-idle-look-tuft{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(0,0) rotate(-.5deg)}32%{transform:translate(.4px,-.2px) rotate(1.5deg)}46%{transform:translate(.8px,-.5px) rotate(2deg)}58%{transform:translate(.8px,-.5px) rotate(2deg)}70%{transform:translate(.5px,-.3px) rotate(1deg)}84%{transform:translate(.2px,-.1px) rotate(.4deg)}100%{transform:translate(0,0) rotate(0)}}
      @keyframes claude-idle-look-gaze{0%{transform:translate(0,0)}20%{transform:translate(1.1px,-.6px)}32%{transform:translate(2.2px,-1.3px)}46%{transform:translate(2.2px,-1.3px)}58%{transform:translate(2.2px,-1.3px)}70%{transform:translate(.8px,-.4px)}84%{transform:translate(.2px,-.1px)}100%{transform:translate(0,0)}}
      @keyframes claude-idle-look-blink{0%{transform:scaleY(1)}20%{transform:scaleY(1)}32%{transform:scaleY(1)}46%{transform:scaleY(1)}58%{transform:scaleY(.12)}70%{transform:scaleY(1)}84%{transform:scaleY(1)}100%{transform:scaleY(1)}}
      @keyframes claude-idle-look-shadow{0%{transform:scaleX(1)}20%{transform:scaleX(.998)}32%{transform:scaleX(.995)}46%{transform:scaleX(.99)}58%{transform:scaleX(.99)}70%{transform:scaleX(.994)}84%{transform:scaleX(.998)}100%{transform:scaleX(1)}}
    </style>
