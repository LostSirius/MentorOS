<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <path id="grok-bolt-shape-base" d="M144 158h18l-18 18h14l-40 40h-20l18-18h-14z"/>
      <style>
      #pointer-body-js { transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt)); transform-box:view-box; transform-origin:128px 164px; }
      #eyes-js { transform:translate(var(--eye-x),var(--eye-y)); }
      #idle-look-gaze-js { animation:grok-idle-look-gaze 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 164px; }
      #blink-js { animation:grok-idle-look-blink 4000ms linear infinite; animation-play-state:var(--play-state); transform-box:fill-box; transform-origin:center; }
      #idle-look-pose-js { animation:grok-idle-look-pose 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 164px; }
      #head-follow-js { animation:grok-idle-look-head 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 150px; }
      #shadow-js { transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch)); transform-box:view-box; transform-origin:128px 241px; }
      #shadow-pulse-js { animation:grok-idle-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:fill-box; transform-origin:center; }
      #shadow-idle-look-js { animation:grok-idle-look-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:fill-box; transform-origin:center; }
      .is-restarting * { animation:none !important; }
      #float-js { animation:grok-idle-float 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 164px; }
      #helmet-idle-balance-js { animation:grok-idle-helmet-balance 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 140px; }
      @keyframes grok-idle-float { 0%{transform:translateY(0)} 20%{transform:translateY(-5px)} 40%{transform:translateY(-10px)} 60%{transform:translateY(-5px)} 76%{transform:translateY(1px)} 79%{transform:translateY(3px)} 82%{transform:translateY(1px)} 100%{transform:translateY(0)} }
      @keyframes grok-idle-helmet-balance { 0%{transform:rotate(0)} 20%{transform:rotate(.2deg)} 40%{transform:rotate(.38deg)} 60%{transform:rotate(.16deg)} 76%{transform:rotate(-.1deg)} 79%{transform:rotate(-.24deg)} 82%{transform:rotate(-.08deg)} 100%{transform:rotate(0)} }
      @keyframes grok-idle-shadow { 0%{transform:scaleX(1);opacity:.22} 20%{transform:scaleX(.91);opacity:.20} 40%{transform:scaleX(.82);opacity:.17} 60%{transform:scaleX(.91);opacity:.20} 76%{transform:scaleX(1.05);opacity:.23} 79%{transform:scaleX(1.10);opacity:.24} 82%{transform:scaleX(1.05);opacity:.23} 100%{transform:scaleX(1);opacity:.22} }
      @keyframes grok-idle-look-pose {
        0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(0,0) rotate(0)}
        32%{transform:translate(-0.4px,-0.2px) rotate(-0.2deg)}
        46%{transform:translate(-0.8px,-0.4px) rotate(-0.4deg)}
        58%{transform:translate(-0.8px,-0.4px) rotate(-0.4deg)}
        70%{transform:translate(-0.8px,-0.4px) rotate(-0.4deg)}
        84%{transform:translate(-0.27999999999999997px,-0.1px) rotate(-0.15000000000000002deg)}
        100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes grok-idle-look-head {
        0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(0,0) rotate(0)}
        32%{transform:translate(-0.5px,-0.3px) rotate(-0.25deg)}
        46%{transform:translate(-1px,-0.6px) rotate(-0.5deg)}
        58%{transform:translate(-1px,-0.6px) rotate(-0.5deg)}
        70%{transform:translate(-1px,-0.6px) rotate(-0.5deg)}
        84%{transform:translate(-0.3px,-0.19999999999999998px) rotate(-0.15deg)}
        100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes grok-idle-look-gaze {
        0%{transform:translate(0,0)}
        20%{transform:translate(-1.2px,-0.7999995px)}
        32%{transform:translate(-2.4px,-1.5px)}
        46%{transform:translate(-2.4px,-1.5px)}
        58%{transform:translate(-2.4px,-1.5px)}
        70%{transform:translate(-1.0000008px,-0.6000000000000001px)}
        84%{transform:translate(-0.19999999999999998px,-0.1px)}
        100%{transform:translate(0,0)}
      }
      @keyframes grok-idle-look-blink {
        0%{transform:scaleY(1)} 20%{transform:scaleY(1)} 32%{transform:scaleY(1)} 46%{transform:scaleY(1)}
        58%{transform:scaleY(.08)} 70%{transform:scaleY(1)} 84%{transform:scaleY(1)} 100%{transform:scaleY(1)}
      }
      @keyframes grok-idle-look-shadow {
        0%{transform:scaleX(1)} 20%{transform:scaleX(.997)} 32%{transform:scaleX(.994)} 46%{transform:scaleX(.99)}
        58%{transform:scaleX(.99)} 70%{transform:scaleX(.994)} 84%{transform:scaleX(.998)} 100%{transform:scaleX(1)}
      }
    </style>
  </defs>

