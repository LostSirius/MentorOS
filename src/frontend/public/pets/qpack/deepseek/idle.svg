<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <style>
      #pointer-body-js { transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt)); transform-box:view-box; transform-origin:128px 166px; }
      #float-js { animation:deepseek-idle-float 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 166px; }
      #buoyancy-sway-js { animation:deepseek-body-sway 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 176px; }
      #eyes-js { transform:translate(var(--eye-x),var(--eye-y)); }
      #blink-js { animation:deepseek-idle-blink 4000ms linear infinite; animation-play-state:var(--play-state); transform-box:fill-box; transform-origin:center; }
      #tail-js { animation:deepseek-tail-sway 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:128px 108px; }
      #left-fin-js { animation:deepseek-fin-left 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:64px 184px; }
      #right-fin-js { animation:deepseek-fin-right 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:192px 184px; }
      #lens-glass-js { animation:deepseek-lens-breathe 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); }
      #lens-highlight-js { animation:deepseek-lens-scan 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:view-box; transform-origin:172px 172px; }
      #star-cyan-js { animation:deepseek-star-cyan 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); }
      #star-blue-js { animation:deepseek-star-blue 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); }
      #star-yellow-js { animation:deepseek-star-yellow 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); }
      #shadow-js { transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch)); transform-box:view-box; transform-origin:128px 241px; }
      #shadow-pulse-js { animation:deepseek-idle-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite; animation-play-state:var(--play-state); transform-box:fill-box; transform-origin:center; }
      .is-restarting * { animation:none !important; }
      @keyframes deepseek-idle-float { 0%{transform:translateY(0)} 20%{transform:translateY(-3px)} 40%{transform:translateY(-7px)} 60%{transform:translateY(-4px)} 76%{transform:translateY(1px)} 79%{transform:translateY(3px)} 82%{transform:translateY(1px)} 100%{transform:translateY(0)} }
      @keyframes deepseek-body-sway { 0%{transform:rotate(0)} 20%{transform:rotate(0.8deg)} 40%{transform:rotate(1.5deg)} 60%{transform:rotate(0.5deg)} 76%{transform:rotate(-0.8deg)} 79%{transform:rotate(-1.5deg)} 82%{transform:rotate(-0.6deg)} 100%{transform:rotate(0)} }
      @keyframes deepseek-idle-blink { 0%{transform:scaleY(1)} 20%{transform:scaleY(1)} 40%{transform:scaleY(1)} 60%{transform:scaleY(1)} 76%{transform:scaleY(.62)} 79%{transform:scaleY(.08)} 82%{transform:scaleY(1)} 100%{transform:scaleY(1)} }
      @keyframes deepseek-tail-sway { 0%{transform:translateX(0) rotate(0)} 20%{transform:translateX(2px) rotate(1deg)} 40%{transform:translateX(3px) rotate(1.4deg)} 60%{transform:translateX(1px) rotate(.5deg)} 76%{transform:translateX(-2px) rotate(-1deg)} 79%{transform:translateX(-3px) rotate(-1.4deg)} 82%{transform:translateX(-1px) rotate(-.5deg)} 100%{transform:translateX(0) rotate(0)} }
      @keyframes deepseek-fin-left { 0%{transform:translateY(0) rotate(0)} 20%{transform:translateY(-1px) rotate(1deg)} 40%{transform:translateY(-2px) rotate(1.5deg)} 60%{transform:translateY(-1px) rotate(.6deg)} 76%{transform:translateY(2px) rotate(-1deg)} 79%{transform:translateY(3px) rotate(-1.5deg)} 82%{transform:translateY(1px) rotate(-.5deg)} 100%{transform:translateY(0) rotate(0)} }
      @keyframes deepseek-fin-right { 0%{transform:translateY(0) rotate(0)} 20%{transform:translateY(1px) rotate(-1deg)} 40%{transform:translateY(2px) rotate(-1.5deg)} 60%{transform:translateY(1px) rotate(-.6deg)} 76%{transform:translateY(-2px) rotate(1deg)} 79%{transform:translateY(-3px) rotate(1.5deg)} 82%{transform:translateY(-1px) rotate(.5deg)} 100%{transform:translateY(0) rotate(0)} }
      @keyframes deepseek-lens-breathe { 0%{fill:#12cfdf;opacity:.84} 20%{fill:#18d8e5;opacity:.9} 40%{fill:#2ce7ef;opacity:1} 60%{fill:#20dde8;opacity:.94} 76%{fill:#16d3e0;opacity:.88} 79%{fill:#12cfdf;opacity:.84} 82%{fill:#14d1df;opacity:.86} 100%{fill:#12cfdf;opacity:.84} }
      @keyframes deepseek-lens-scan { 0%{transform:translateX(0);opacity:.72} 20%{transform:translateX(1px);opacity:.82} 40%{transform:translateX(2px);opacity:1} 60%{transform:translateX(1px);opacity:.86} 76%{transform:translateX(-1px);opacity:.78} 79%{transform:translateX(-2px);opacity:.72} 82%{transform:translateX(-1px);opacity:.76} 100%{transform:translateX(0);opacity:.72} }
      @keyframes deepseek-star-cyan { 0%{transform:translate(0,0)} 20%{transform:translate(1px,-1px)} 40%{transform:translate(1px,-2px)} 60%{transform:translate(0,-1px)} 76%{transform:translate(-1px,1px)} 79%{transform:translate(-1px,2px)} 82%{transform:translate(0,1px)} 100%{transform:translate(0,0)} }
      @keyframes deepseek-star-blue { 0%{transform:translate(0,0)} 20%{transform:translate(-1px,1px)} 40%{transform:translate(-2px,1px)} 60%{transform:translate(-1px,0)} 76%{transform:translate(1px,-1px)} 79%{transform:translate(2px,-1px)} 82%{transform:translate(1px,0)} 100%{transform:translate(0,0)} }
      @keyframes deepseek-star-yellow { 0%{transform:translate(0,0)} 20%{transform:translate(1px,1px)} 40%{transform:translate(2px,1px)} 60%{transform:translate(1px,0)} 76%{transform:translate(-1px,-1px)} 79%{transform:translate(-2px,-1px)} 82%{transform:translate(-1px,0)} 100%{transform:translate(0,0)} }
      @keyframes deepseek-idle-shadow { 0%{transform:scaleX(1);opacity:.22} 20%{transform:scaleX(.94);opacity:.20} 40%{transform:scaleX(.86);opacity:.17} 60%{transform:scaleX(.93);opacity:.20} 76%{transform:scaleX(1.04);opacity:.23} 79%{transform:scaleX(1.07);opacity:.24} 82%{transform:scaleX(1.04);opacity:.23} 100%{transform:scaleX(1);opacity:.22} }
    </style>
  </defs>

