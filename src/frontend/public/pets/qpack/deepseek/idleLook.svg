        70%{transform:translate(0.8px,-0.5px) rotate(0.4deg)}
        84%{transform:translate(0.24px,-0.16666666666666666px) rotate(0.12deg)}
        100%{transform:translate(0,0) rotate(0)}
      }
      @keyframes deepseek-idle-look-gaze {
        0%{transform:translate(0,0)}
        20%{transform:translate(1.1px,-0.7466661999999998px)}
        32%{transform:translate(2.2px,-1.4px)}
        46%{transform:translate(2.2px,-1.4px)}
        58%{transform:translate(2.2px,-1.4px)}
        70%{transform:translate(0.9166674000000001px,-0.5599999999999999px)}
        84%{transform:translate(0.18333333333333335px,-0.09333333333333332px)}
        100%{transform:translate(0,0)}
      }
      @keyframes deepseek-idle-look-blink {
        0%{transform:scaleY(1)} 20%{transform:scaleY(1)} 32%{transform:scaleY(1)} 46%{transform:scaleY(1)}
        58%{transform:scaleY(.08)} 70%{transform:scaleY(1)} 84%{transform:scaleY(1)} 100%{transform:scaleY(1)}
      }
      @keyframes deepseek-idle-look-shadow {
        0%{transform:scaleX(1)} 20%{transform:scaleX(.997)} 32%{transform:scaleX(.994)} 46%{transform:scaleX(.99)}
        58%{transform:scaleX(.99)} 70%{transform:scaleX(.994)} 84%{transform:scaleX(.998)} 100%{transform:scaleX(1)}
      }
    </style>
  </defs>
