<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <style>
      #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 158px}
      #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
      #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 232px}
      .is-restarting *{animation:none!important}
      #juggling-pose-js{animation:qwen-juggling-pose 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 158px}
      #antenna-js{animation:qwen-juggling-antenna 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:126px 96px}
      #juggling-gaze-js{animation:qwen-juggling-gaze 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 152px}
      #left-arm-motion-js{animation:qwen-juggling-left-arm 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:52px 166px}
      #right-arm-motion-js{animation:qwen-juggling-right-arm 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:204px 166px}
      #blink-js{animation:qwen-juggling-blink 2800ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #shadow-pulse-js{animation:qwen-juggling-shadow 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #star-purple-motion-js{animation:qwen-juggling-star-purple 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:111px 31px}
      #star-pink-motion-js{animation:qwen-juggling-star-pink 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:171px 49px}
      #star-yellow-motion-js{animation:qwen-juggling-star-yellow 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:92px 64px}
      @keyframes qwen-juggling-pose{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(-1px,-1px) rotate(-0.4deg)}26%{transform:translate(1px,-1.5px) rotate(0.5deg)}40%{transform:translate(-1px,-1px) rotate(-0.5deg)}54%{transform:translate(1px,-1.5px) rotate(0.5deg)}68%{transform:translate(-1px,-1px) rotate(-0.4deg)}84%{transform:translate(0px,-0.5px) rotate(0.2deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-antenna{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(0px,-1px) rotate(-4deg)}26%{transform:translate(0px,-2px) rotate(4deg)}40%{transform:translate(0px,-1px) rotate(-4deg)}54%{transform:translate(0px,-2px) rotate(4deg)}68%{transform:translate(0px,-1px) rotate(-4deg)}84%{transform:translate(0px,-1px) rotate(2deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-gaze{0%{transform:translate(0px,0px)}12%{transform:translate(-1px,-1px)}26%{transform:translate(1px,-0.8px)}40%{transform:translate(-1px,-1px)}54%{transform:translate(1px,-0.8px)}68%{transform:translate(-1px,-1px)}84%{transform:translate(0px,-0.3px)}100%{transform:translate(0px,0px)}}
      @keyframes qwen-juggling-left-arm{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(2px,-3px) rotate(4deg)}26%{transform:translate(0px,1px) rotate(-1deg)}40%{transform:translate(2px,-3px) rotate(4deg)}54%{transform:translate(0px,1px) rotate(-1deg)}68%{transform:translate(2px,-3px) rotate(4deg)}84%{transform:translate(1px,-1px) rotate(2deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-right-arm{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(0px,1px) rotate(1deg)}26%{transform:translate(-2px,-3px) rotate(-4deg)}40%{transform:translate(0px,1px) rotate(1deg)}54%{transform:translate(-2px,-3px) rotate(-4deg)}68%{transform:translate(0px,1px) rotate(1deg)}84%{transform:translate(-1px,-1px) rotate(-2deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-blink{0%{transform:scaleY(1)}12%{transform:scaleY(1)}26%{transform:scaleY(1)}40%{transform:scaleY(1)}54%{transform:scaleY(1)}68%{transform:scaleY(1)}84%{transform:scaleY(1)}100%{transform:scaleY(1)}}
      @keyframes qwen-juggling-shadow{0%{transform:scaleX(1)}12%{transform:scaleX(0.99)}26%{transform:scaleX(0.98)}40%{transform:scaleX(0.99)}54%{transform:scaleX(0.98)}68%{transform:scaleX(0.99)}84%{transform:scaleX(1)}100%{transform:scaleX(1)}}
      @keyframes qwen-juggling-star-purple{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(-4px,2px) rotate(-4deg)}26%{transform:translate(3px,-5px) rotate(4deg)}40%{transform:translate(4px,1px) rotate(5deg)}54%{transform:translate(-3px,-4px) rotate(-4deg)}68%{transform:translate(-4px,1px) rotate(-5deg)}84%{transform:translate(1px,-1px) rotate(1deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-star-pink{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(3px,-4px) rotate(4deg)}26%{transform:translate(4px,1px) rotate(5deg)}40%{transform:translate(-3px,-5px) rotate(-4deg)}54%{transform:translate(-4px,1px) rotate(-5deg)}68%{transform:translate(3px,-4px) rotate(4deg)}84%{transform:translate(1px,-1px) rotate(1deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
      @keyframes qwen-juggling-star-yellow{0%{transform:translate(0px,0px) rotate(0deg)}12%{transform:translate(4px,1px) rotate(5deg)}26%{transform:translate(-3px,-4px) rotate(-4deg)}40%{transform:translate(-4px,1px) rotate(-5deg)}54%{transform:translate(3px,-5px) rotate(4deg)}68%{transform:translate(4px,1px) rotate(5deg)}84%{transform:translate(-1px,-1px) rotate(-1deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    </style>
  </defs>
