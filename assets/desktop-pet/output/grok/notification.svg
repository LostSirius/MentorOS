<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <path id="grok-bolt-shape-base" d="M144 158h18l-18 18h14l-40 40h-20l18-18h-14z"/>
    <style>
    #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 164px}
    #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
    #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 241px}
    #notification-pose-js{animation:grok-notification-pose 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 164px}
    #notification-gaze-js{animation:grok-notification-gaze 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state)}
    #blink-js{animation:grok-notification-blink 2400ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
    #shadow-pulse-js{animation:grok-notification-shadow 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
    #head-build-js{animation:grok-notification-head 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 140px}
    #left-arm-build-js{animation:grok-notification-left-arm 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:64px 184px}
    #right-arm-build-js{animation:grok-notification-right-arm 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:192px 184px}
    #bolt-js{animation:grok-notification-bolt 2400ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 188px}
    .is-restarting *{animation:none!important}
    @keyframes grok-notification-pose{0%{transform:translateY(0px) rotate(0deg)}8%{transform:translateY(-2px) rotate(0.4deg)}16%{transform:translateY(0px) rotate(0deg)}26%{transform:translateY(-1px) rotate(-0.2deg)}36%{transform:translateY(0px) rotate(0deg)}40%{transform:translateY(0px) rotate(0deg)}70%{transform:translateY(0px) rotate(0deg)}100%{transform:translateY(0px) rotate(0deg)}}
    @keyframes grok-notification-gaze{0%{transform:translate(0px,0px)}8%{transform:translate(0px,-1.5px)}16%{transform:translate(0px,0px)}26%{transform:translate(0px,-0.75px)}36%{transform:translate(0px,0px)}40%{transform:translate(0px,0px)}70%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
    @keyframes grok-notification-blink{0%{transform:scaleY(1)}8%{transform:scaleY(1)}16%{transform:scaleY(1)}26%{transform:scaleY(1)}36%{transform:scaleY(1)}40%{transform:scaleY(1)}70%{transform:scaleY(1)}100%{transform:scaleY(1)}}
    @keyframes grok-notification-shadow{0%{transform:scaleX(1)}8%{transform:scaleX(0.98)}16%{transform:scaleX(1)}26%{transform:scaleX(0.99)}36%{transform:scaleX(1)}40%{transform:scaleX(1)}70%{transform:scaleX(1)}100%{transform:scaleX(1)}}
    @keyframes grok-notification-head{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(0px,-2px) rotate(0.6deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0px,-1px) rotate(-0.3deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes grok-notification-left-arm{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(1px,-2px) rotate(-2deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0.5px,-1px) rotate(-1deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes grok-notification-right-arm{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(-1px,-2px) rotate(2deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(-0.5px,-1px) rotate(1deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes grok-notification-bolt{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(0px,-2px) rotate(5deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0px,-1px) rotate(2.5deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
  </style>
