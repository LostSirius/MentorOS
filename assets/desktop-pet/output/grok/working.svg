<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs>
    <path id="grok-bolt-shape-base" d="M144 158h18l-18 18h14l-40 40h-20l18-18h-14z"/>
      <style>
      #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 164px}
      #working-pose-js{animation:grok-working-pose 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 164px}
      #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
      #working-gaze-js{animation:grok-working-gaze 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 164px}
      #blink-js{animation:grok-working-blink 3200ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      #head-work-js{animation:grok-working-head 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 140px}
      #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 241px}
      #shadow-pulse-js{animation:grok-working-shadow 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
      .is-restarting *{animation:none!important}
      #left-arm-work-js{animation:grok-working-left-arm 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:64px 184px}
      #right-arm-work-js{animation:grok-working-right-arm 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:192px 184px}
      #bolt-js{animation:grok-working-bolt 3200ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 188px}
      @keyframes grok-working-pose{0%{transform:translateY(0) rotate(0)}10%{transform:translateY(-1px) rotate(-.5deg)}22%{transform:translateY(-2px) rotate(.5deg)}36%{transform:translateY(-1px) rotate(-.5deg)}52%{transform:translateY(-2px) rotate(.5deg)}68%{transform:translateY(-1px) rotate(-.3deg)}84%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes grok-working-head{0%{transform:translateY(0) rotate(0)}10%{transform:translateY(-1px) rotate(-.4deg)}22%{transform:translateY(0) rotate(.4deg)}36%{transform:translateY(-1px) rotate(-.4deg)}52%{transform:translateY(0) rotate(.4deg)}68%{transform:translateY(-1px) rotate(-.2deg)}84%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes grok-working-gaze{0%{transform:translate(0,0)}10%{transform:translate(0,1px)}22%{transform:translate(.5px,1px)}36%{transform:translate(-.5px,1px)}52%{transform:translate(.5px,1px)}68%{transform:translate(0,0)}84%{transform:translate(0,1px)}100%{transform:translate(0,0)}}
      @keyframes grok-working-blink{0%{transform:scaleY(1)}10%{transform:scaleY(1)}22%{transform:scaleY(1)}36%{transform:scaleY(1)}52%{transform:scaleY(1)}68%{transform:scaleY(.25)}84%{transform:scaleY(1)}100%{transform:scaleY(1)}}
      @keyframes grok-working-left-arm{0%{transform:translateY(0) rotate(0)}10%{transform:translateY(3px) rotate(3deg)}22%{transform:translateY(-3px) rotate(-3deg)}36%{transform:translateY(3px) rotate(3deg)}52%{transform:translateY(-3px) rotate(-3deg)}68%{transform:translateY(2px) rotate(2deg)}84%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes grok-working-right-arm{0%{transform:translateY(0) rotate(0)}10%{transform:translateY(-3px) rotate(-3deg)}22%{transform:translateY(3px) rotate(3deg)}36%{transform:translateY(-3px) rotate(-3deg)}52%{transform:translateY(3px) rotate(3deg)}68%{transform:translateY(-2px) rotate(-2deg)}84%{transform:translateY(0) rotate(0)}100%{transform:translateY(0) rotate(0)}}
      @keyframes grok-working-bolt{0%{transform:translateY(0);opacity:.82}10%{transform:translateY(-1px);opacity:1}22%{transform:translateY(0);opacity:.86}36%{transform:translateY(-1px);opacity:1}52%{transform:translateY(0);opacity:.86}68%{transform:translateY(-1px);opacity:1}84%{transform:translateY(0);opacity:.88}100%{transform:translateY(0);opacity:.82}}
      @keyframes grok-working-shadow{0%{transform:scaleX(1);opacity:.22}10%{transform:scaleX(1.02);opacity:.23}22%{transform:scaleX(.98);opacity:.20}36%{transform:scaleX(1.02);opacity:.23}52%{transform:scaleX(.98);opacity:.20}68%{transform:scaleX(1.01);opacity:.23}84%{transform:scaleX(1);opacity:.22}100%{transform:scaleX(1);opacity:.22}}
    </style>
  </defs>

