    @keyframes deepseek-happy-head{0%{transform:translate(0px,0px) rotate(0deg)}14%{transform:translate(0px,-0.5px) rotate(-0.15deg)}30%{transform:translate(0px,-1px) rotate(0.25deg)}46%{transform:translate(0px,-1px) rotate(-0.25deg)}62%{transform:translate(0px,-1px) rotate(0.2deg)}76%{transform:translate(0px,-0.5px) rotate(-0.1deg)}88%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes deepseek-happy-left-fin{0%{transform:translate(0px,0px) rotate(0deg)}14%{transform:translate(-1px,-2px) rotate(-3deg)}30%{transform:translate(-2px,-5px) rotate(-5deg)}46%{transform:translate(-1px,-4px) rotate(-4deg)}62%{transform:translate(-2px,-5px) rotate(-5deg)}76%{transform:translate(-1px,-2px) rotate(-3deg)}88%{transform:translate(0px,-1px) rotate(-1deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
