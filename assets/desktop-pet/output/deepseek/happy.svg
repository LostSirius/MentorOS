    @keyframes deepseek-happy-star-blue{0%{transform:translate(0px,0px) rotate(0deg)}14%{transform:translate(-1px,-1px) rotate(0deg)}30%{transform:translate(-3px,-2px) rotate(0deg)}46%{transform:translate(-2px,-2px) rotate(0deg)}62%{transform:translate(-3px,-2px) rotate(0deg)}76%{transform:translate(-1px,-1px) rotate(0deg)}88%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes deepseek-happy-star-yellow{0%{transform:translate(0px,0px) rotate(0deg)}14%{transform:translate(1px,-1px) rotate(0deg)}30%{transform:translate(3px,-2px) rotate(0deg)}46%{transform:translate(2px,-2px) rotate(0deg)}62%{transform:translate(3px,-2px) rotate(0deg)}76%{transform:translate(1px,-1px) rotate(0deg)}88%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
