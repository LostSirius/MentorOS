<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
  <defs><style>
    #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 166px}
    #eyes-js{transform:translate(var(--eye-x),var(--eye-y))}
    #shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 241px}
    #notification-pose-js{animation:deepseek-notification-pose 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 166px}
    #notification-gaze-js{animation:deepseek-notification-gaze 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state)}
    #blink-js{animation:deepseek-notification-blink 2800ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
    #shadow-pulse-js{animation:deepseek-notification-shadow 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}
    #head-build-js{animation:deepseek-notification-head 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 183px}
    #left-fin-js{animation:deepseek-notification-left-fin 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:64px 184px}
    #right-fin-js{animation:deepseek-notification-right-fin 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:192px 184px}
    #tail-js{animation:deepseek-notification-tail 2800ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 108px}
    .is-restarting *{animation:none!important}
    @keyframes deepseek-notification-pose{0%{transform:translateY(0px) rotate(0deg)}8%{transform:translateY(-2px) rotate(0deg)}16%{transform:translateY(0px) rotate(0deg)}26%{transform:translateY(-1px) rotate(0deg)}36%{transform:translateY(0px) rotate(0deg)}40%{transform:translateY(0px) rotate(0deg)}70%{transform:translateY(0px) rotate(0deg)}100%{transform:translateY(0px) rotate(0deg)}}
    @keyframes deepseek-notification-gaze{0%{transform:translate(0px,0px)}8%{transform:translate(0px,-1.5px)}16%{transform:translate(0px,0px)}26%{transform:translate(0px,-0.75px)}36%{transform:translate(0px,0px)}40%{transform:translate(0px,0px)}70%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
    @keyframes deepseek-notification-blink{0%{transform:scaleY(1)}8%{transform:scaleY(1)}16%{transform:scaleY(1)}26%{transform:scaleY(1)}36%{transform:scaleY(1)}40%{transform:scaleY(1)}70%{transform:scaleY(1)}100%{transform:scaleY(1)}}
    @keyframes deepseek-notification-shadow{0%{transform:scaleX(1)}8%{transform:scaleX(0.98)}16%{transform:scaleX(1)}26%{transform:scaleX(0.99)}36%{transform:scaleX(1)}40%{transform:scaleX(1)}70%{transform:scaleX(1)}100%{transform:scaleX(1)}}
    @keyframes deepseek-notification-head{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(0px,0px) rotate(0deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0px,0px) rotate(0deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes deepseek-notification-left-fin{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(1px,-2px) rotate(-2deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0.5px,-1px) rotate(-1deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes deepseek-notification-right-fin{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(-1px,-2px) rotate(2deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(-0.5px,-1px) rotate(1deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
    @keyframes deepseek-notification-tail{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(1px,0px) rotate(1deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(0.5px,0px) rotate(0.5deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
  </style></defs>
