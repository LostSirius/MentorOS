<!doctype html>

<body>
  <main>

              @keyframes deepseek-star-yellow { 0%{transform:translate(0,0)} 20%{transform:translate(1px,1px)} 40%{transform:translate(2px,1px)} 60%{transform:translate(1px,0)} 76%{transform:translate(-1px,-1px)} 79%{transform:translate(-2px,-1px)} 82%{transform:translate(-1px,0)} 100%{transform:translate(0,0)} }
              @keyframes deepseek-idle-shadow { 0%{transform:scaleX(1);opacity:.22} 20%{transform:scaleX(.94);opacity:.20} 40%{transform:scaleX(.86);opacity:.17} 60%{transform:scaleX(.93);opacity:.20} 76%{transform:scaleX(1.04);opacity:.23} 79%{transform:scaleX(1.07);opacity:.24} 82%{transform:scaleX(1.04);opacity:.23} 100%{transform:scaleX(1);opacity:.22} }
            </style>

            <g id="arms-js"><g id="left-fin-js"><path d="M56 170h12v12h4v18h-8v8h-8v8H40v-18h8v-20h8z" fill="#0a398f"/><path d="M52 178h12v20h-8v10H44v-10h4v-16h4z" fill="#246ed6"/><path d="M44 198h12v10H44z" fill="#3895ee" opacity="0.62"/></g><g id="right-fin-js"><path d="M200 170h-12v12h-4v18h8v8h8v8h16v-18h-8v-20h-8z" fill="#0a398f"/><path d="M204 178h-12v20h8v10h12v-10h-4v-16h-4z" fill="#246ed6"/><path d="M200 198h12v10h-12z" fill="#3895ee" opacity="0.62"/></g></g>

      </div>
      <div id="pointer-capture" class="tracking-capture" aria-hidden="true"><span id="tracking-top-left" class="tracking-hitbox tracking-hitbox--top-left"></span><span id="tracking-top-right" class="tracking-hitbox tracking-hitbox--top-right"></span><span id="tracking-bottom-left" class="tracking-hitbox tracking-hitbox--bottom-left"></span><span id="tracking-bottom-right" class="tracking-hitbox tracking-hitbox--bottom-right"></span><span id="tracking-top" class="tracking-hitbox tracking-hitbox--top"></span><span id="tracking-bottom" class="tracking-hitbox tracking-hitbox--bottom"></span><span id="tracking-center" class="tracking-hitbox tracking-hitbox--center"></span></div>

    <div id="status" role="status">正在初始化内联 SVG…</div>
  </main>
  <script>
    (()=>{
      const stage=document.getElementById('stage'),petObject=document.getElementById('pet-object'),pointerCapture=document.getElementById('pointer-capture'),status=document.getElementById('status'),svgRoot=petObject.querySelector('svg');
      const state={loaded:false,playing:true,size:128,background:'transparent',loopCount:0,errors:[]};
      const C={fullScaleStageRatioX:.30,fullScaleStageRatioY:.30,bodyMaxX:16,bodyMaxY:12,bodyMaxTilt:3,eyeMax:3,shadowMaxX:12,shadowMaxY:5,shadowMaxStretch:1.08,smoothingCoefficient:.20,returnDelayMs:650,returnSettleThreshold:.003,expectedReturnDurationMs:500};
      let currentX=0,currentY=0,targetX=0,targetY=0,lastFrameAt=performance.now(),lastInputAt=performance.now(),returnTimer=0,settleTimer=0,returnStartedAt=0,centeredAt=0;
      const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
      function updateStatus(){status.textContent=`${state.loaded?'SVG 已载入':'正在初始化内联 SVG'} · ${state.playing?'播放中':'已暂停'} · ${state.size}px · 已完成 ${state.loopCount} 个循环`;}
      function writePointerValues(x,y){svgRoot.style.setProperty('--body-x',`${(x*C.bodyMaxX).toFixed(2)}px`);svgRoot.style.setProperty('--body-y',`${(y*C.bodyMaxY).toFixed(2)}px`);svgRoot.style.setProperty('--body-tilt',`${(x*C.bodyMaxTilt).toFixed(2)}deg`);svgRoot.style.setProperty('--eye-x',`${(x*C.eyeMax).toFixed(2)}px`);svgRoot.style.setProperty('--eye-y',`${(y*C.eyeMax).toFixed(2)}px`);svgRoot.style.setProperty('--shadow-x',`${(-x*C.shadowMaxX).toFixed(2)}px`);svgRoot.style.setProperty('--shadow-y',`${(-y*C.shadowMaxY).toFixed(2)}px`);svgRoot.style.setProperty('--shadow-stretch',(1+Math.abs(x)*(C.shadowMaxStretch-1)).toFixed(3));const s=state.size/256;petObject.dataset.pointerQa=JSON.stringify({normalizedX:+x.toFixed(4),normalizedY:+y.toFixed(4),targetX:+targetX.toFixed(4),targetY:+targetY.toFixed(4),bodyX:(x*C.bodyMaxX).toFixed(2),bodyY:(y*C.bodyMaxY).toFixed(2),bodyTilt:(x*C.bodyMaxTilt).toFixed(2),eyeX:(x*C.eyeMax).toFixed(2),eyeY:(y*C.eyeMax).toFixed(2),shadowX:(-x*C.shadowMaxX).toFixed(2),shadowY:(-y*C.shadowMaxY).toFixed(2),shadowStretch:(1+Math.abs(x)*(C.shadowMaxStretch-1)).toFixed(3),visibleBodyX:(x*C.bodyMaxX*s).toFixed(2),visibleBodyY:(y*C.bodyMaxY*s).toFixed(2),visibleEyeX:(x*C.eyeMax*s).toFixed(2),visibleEyeY:(y*C.eyeMax*s).toFixed(2),visibleShadowX:(-x*C.shadowMaxX*s).toFixed(2),visibleShadowY:(-y*C.shadowMaxY*s).toFixed(2),lastInputAt,returnStartedAt,centeredAt,measuredWaitMs:returnStartedAt?Math.round(returnStartedAt-lastInputAt):null,measuredReturnMs:centeredAt&&returnStartedAt?Math.round(centeredAt-returnStartedAt):null});}
      function tick(now){const ratio=clamp((now-lastFrameAt)/(1000/60),.5,6),alpha=1-Math.pow(1-C.smoothingCoefficient,ratio);currentX+=(targetX-currentX)*alpha;currentY+=(targetY-currentY)*alpha;if(returnStartedAt&&!centeredAt&&Math.abs(currentX)<C.returnSettleThreshold&&Math.abs(currentY)<C.returnSettleThreshold){currentX=0;currentY=0;centeredAt=now;if(settleTimer){clearTimeout(settleTimer);settleTimer=0;}}writePointerValues(currentX,currentY);lastFrameAt=now;requestAnimationFrame(tick);}
      function beginReturn(){returnTimer=0;returnStartedAt=performance.now();centeredAt=0;targetX=0;targetY=0;if(settleTimer)clearTimeout(settleTimer);settleTimer=setTimeout(()=>{if(!returnStartedAt||targetX!==0||targetY!==0)return;currentX=0;currentY=0;centeredAt=performance.now();writePointerValues(0,0);settleTimer=0;},C.expectedReturnDurationMs);}
      function scheduleReturn(){if(returnTimer)clearTimeout(returnTimer);returnTimer=setTimeout(beginReturn,C.returnDelayMs);}
      function setPointerTarget(x,y){if(returnTimer){clearTimeout(returnTimer);returnTimer=0}if(settleTimer){clearTimeout(settleTimer);settleTimer=0}returnStartedAt=0;centeredAt=0;targetX=clamp(x,-1,1);targetY=clamp(y,-1,1);lastInputAt=performance.now();scheduleReturn();}
      function handlePointerMove(e){const sr=stage.getBoundingClientRect(),pr=petObject.getBoundingClientRect(),ox=pr.left+pr.width/2,oy=pr.top+pr.height/2;setPointerTarget((e.clientX-ox)/(sr.width*C.fullScaleStageRatioX),(e.clientY-oy)/(sr.height*C.fullScaleStageRatioY));}
      function setPlaying(v){state.playing=v;svgRoot.style.setProperty('--play-state',v?'running':'paused');updateStatus();}
      function restart(){state.loopCount=0;svgRoot.classList.add('is-restarting');setTimeout(()=>svgRoot.classList.remove('is-restarting'),30);svgRoot.style.setProperty('--play-state',state.playing?'running':'paused');updateStatus();}
      function setSize(size){state.size=size;petObject.style.width=`${size}px`;petObject.style.height=`${size}px`;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===size)));writePointerValues(currentX,currentY);updateStatus();}
      function setBackground(bg){state.background=bg;stage.dataset.background=bg;document.querySelectorAll('button[data-background]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.background===bg)));}
      const floatLayer=svgRoot.querySelector('#float-js');
      if(floatLayer){floatLayer.addEventListener('animationiteration',e=>{if(e.target===floatLayer&&e.animationName==='deepseek-idle-float'){state.loopCount++;updateStatus();}});state.loaded=true;}else state.errors.push('缺少 float-js 动画图层');
      pointerCapture.addEventListener('pointermove',handlePointerMove);pointerCapture.addEventListener('pointerdown',handlePointerMove);pointerCapture.addEventListener('pointerleave',scheduleReturn);document.getElementById('play-button').addEventListener('click',()=>setPlaying(true));document.getElementById('pause-button').addEventListener('click',()=>setPlaying(false));document.getElementById('restart-button').addEventListener('click',restart);document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>setSize(+b.dataset.size)));document.querySelectorAll('button[data-background]').forEach(b=>b.addEventListener('click',()=>setBackground(b.dataset.background)));window.addEventListener('error',e=>state.errors.push(e.message||'window error'));window.addEventListener('unhandledrejection',e=>state.errors.push(String(e.reason)));window.petQA={getState:()=>JSON.parse(JSON.stringify(state)),setSize,setBackground,pause:()=>setPlaying(false),play:()=>setPlaying(true),restart,simulatePointer:setPointerTarget,resetPointer:beginReturn};writePointerValues(0,0);requestAnimationFrame(tick);updateStatus();
    })();
  </script>
