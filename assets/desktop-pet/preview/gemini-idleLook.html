<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini IdleLook SVG Preview</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111522;color:#f5f7ff;padding:24px}main{width:min(760px,100%)}h1{margin:0 0 4px;font-size:20px}p{margin:0 0 16px;color:#b9c0d7;font-size:13px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}.label{color:#b9c0d7;font-size:12px;margin-left:4px}button{border:1px solid #47506a;border-radius:7px;padding:7px 10px;background:#20263a;color:#f5f7ff;font:inherit;font-size:13px;cursor:pointer}button[aria-pressed="true"]{border-color:#7983ff;background:#5664f5}.stage{position:relative;height:360px;overflow:hidden;display:grid;place-items:center;border:1px solid #3b4359;border-radius:14px}.stage[data-background="transparent"]{background-color:#f4f5f7;background-image:linear-gradient(45deg,#dfe4ef 25%,transparent 25%),linear-gradient(-45deg,#dfe4ef 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe4ef 75%),linear-gradient(-45deg,transparent 75%,#dfe4ef 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.stage[data-background="dark"]{background:#0d1220}.stage[data-background="light"]{background:#eef2f8}#pet-object{position:relative;z-index:2;width:128px;height:128px;background:transparent;pointer-events:none;overflow:visible}#pet-object>svg{display:block;width:100%;height:100%;overflow:visible}.tracking-capture{position:absolute;inset:0;z-index:3;cursor:crosshair;touch-action:none}.tracking-hitbox{position:absolute;width:24px;height:24px;opacity:0;pointer-events:auto}.tracking-hitbox--top-left{top:0;left:0}.tracking-hitbox--top{top:0;left:50%;transform:translateX(-50%)}.tracking-hitbox--top-right{top:0;right:0}.tracking-hitbox--left{top:50%;left:0;transform:translateY(-50%)}.tracking-hitbox--center{top:50%;left:50%;transform:translate(-50%,-50%)}.tracking-hitbox--right{top:50%;right:0;transform:translateY(-50%)}.tracking-hitbox--bottom-left{bottom:0;left:0}.tracking-hitbox--bottom{bottom:0;left:50%;transform:translateX(-50%)}.tracking-hitbox--bottom-right{bottom:0;right:0}#status{min-height:22px;margin-top:12px;color:#b9c0d7;font-size:13px;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <main>
    <h1>Gemini · idleLook</h1>
    <p>眼睛先注意右上方，菱形主体轻微跟随；眨眼后眼睛先回中，主体随后复位。</p>
    <div class="controls" aria-label="预览控制">
      <span class="label">播放</span><button id="play-button" type="button">播放</button><button id="pause-button" type="button">暂停</button><button id="restart-button" type="button">重新开始</button>
      <span class="label">尺寸</span><button type="button" data-size="64">64px</button><button type="button" data-size="96">96px</button><button type="button" data-size="128" aria-pressed="true">128px</button>
      <span class="label">背景</span><button type="button" data-background="transparent" aria-pressed="true">透明</button><button type="button" data-background="dark">深色</button><button type="button" data-background="light">浅色</button>
    </div>
    <div id="stage" class="stage" data-background="transparent" data-testid="preview-stage">
      <div id="pet-object" role="img" aria-label="Gemini idleLook 动画">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;overflow:visible;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
          <defs>
            <linearGradient id="gemini-body-gradient-base" x1="128" y1="72" x2="128" y2="216" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4388f5"/><stop offset="0.38" stop-color="#696fee"/><stop offset="0.68" stop-color="#a45ee7"/><stop offset="1" stop-color="#fb6aac"/></linearGradient>
            <clipPath id="gemini-body-clip-base"><path d="M114 72h20v8h8v8h8v8h8v8h8v8h8v8h8v8h16v8h16v16h-16v8h-8v8h-8v8h-8v8h-8v16h-16v16h-16v-16h-16v16h-16v-16H86v-16h-8v-8h-8v-8h-8v-8H46v-8h-8v-16h16v-8h8v-8h8v-8h8v-8h8v-8h8v-8h8v-8h12z"/></clipPath>
            <style>
              #pointer-body-js{transform:translate(var(--body-x),var(--body-y)) rotate(var(--body-tilt));transform-box:view-box;transform-origin:128px 152px}#float-js{animation:gemini-idle-float 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 152px}#idle-look-pose-js{animation:gemini-idle-look-pose 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 152px}#eyes-js{transform:translate(var(--eye-x),var(--eye-y))}#idle-look-gaze-js{animation:gemini-idle-look-gaze 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:view-box;transform-origin:128px 152px}#blink-js{animation:gemini-idle-look-blink 4000ms linear infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}#shadow-js{transform:translate(var(--shadow-x),var(--shadow-y)) scaleX(var(--shadow-stretch));transform-box:view-box;transform-origin:128px 224px}#shadow-pulse-js{animation:gemini-idle-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}#shadow-idle-look-js{animation:gemini-idle-look-shadow 4000ms cubic-bezier(0.45,0,0.55,1) infinite;animation-play-state:var(--play-state);transform-box:fill-box;transform-origin:center}.is-paused *{animation-play-state:paused!important}.is-restarting *{animation:none!important}
              @keyframes gemini-idle-float{0%{transform:translateY(0)}20%{transform:translateY(-5px)}40%{transform:translateY(-10px)}60%{transform:translateY(-5px)}76%{transform:translateY(1px)}79%{transform:translateY(3px)}82%{transform:translateY(1px)}100%{transform:translateY(0)}}
              @keyframes gemini-idle-look-pose{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(0,0) rotate(0)}32%{transform:translate(.4px,-.2px) rotate(.2deg)}46%{transform:translate(.8px,-.4px) rotate(.4deg)}58%{transform:translate(.8px,-.4px) rotate(.4deg)}70%{transform:translate(.8px,-.4px) rotate(.4deg)}84%{transform:translate(.3px,-.1px) rotate(.15deg)}100%{transform:translate(0,0) rotate(0)}}
              @keyframes gemini-idle-look-gaze{0%{transform:translate(0,0)}20%{transform:translate(1.2px,-.8px)}32%{transform:translate(2.4px,-1.5px)}46%{transform:translate(2.4px,-1.5px)}58%{transform:translate(2.4px,-1.5px)}70%{transform:translate(1px,-.6px)}84%{transform:translate(.2px,-.1px)}100%{transform:translate(0,0)}}
              @keyframes gemini-idle-look-blink{0%{transform:scaleY(1)}20%{transform:scaleY(1)}32%{transform:scaleY(1)}46%{transform:scaleY(1)}58%{transform:scaleY(.08)}70%{transform:scaleY(1)}84%{transform:scaleY(1)}100%{transform:scaleY(1)}}
              @keyframes gemini-idle-shadow{0%{transform:scaleX(1);opacity:.22}20%{transform:scaleX(.90);opacity:.20}40%{transform:scaleX(.80);opacity:.17}60%{transform:scaleX(.90);opacity:.20}76%{transform:scaleX(1.05);opacity:.23}79%{transform:scaleX(1.10);opacity:.24}82%{transform:scaleX(1.05);opacity:.23}100%{transform:scaleX(1);opacity:.22}}
              @keyframes gemini-idle-look-shadow{0%{transform:scaleX(1)}20%{transform:scaleX(.997)}32%{transform:scaleX(.994)}46%{transform:scaleX(.99)}58%{transform:scaleX(.99)}70%{transform:scaleX(.994)}84%{transform:scaleX(.998)}100%{transform:scaleX(1)}}
            </style>
          </defs>
          <g id="shadow-js"><g id="shadow-pulse-js"><g id="shadow-idle-look-js"><ellipse cx="128" cy="224" rx="48" ry="6" fill="#120d2b"/></g></g></g>
          <g id="pointer-body-js" shape-rendering="crispEdges"><g id="float-js"><g id="idle-look-pose-js">
            <g id="accessory-js"><path d="M122 18h12v9h9v12h-9v9h-12v-9h-9V27h9z" fill="#ffd81a"/><path d="M92 45h10v8h8v10h-8v8H92v-8h-8V53h8z" fill="#55b94a"/><path d="M158 49h10v9h9v10h-9v9h-10v-9h-9V58h9z" fill="#3bb9e9"/></g>
            <g id="body-js"><path d="M114 72h20v8h8v8h8v8h8v8h8v8h8v8h8v8h16v8h16v16h-16v8h-8v8h-8v8h-8v8h-8v16h-16v16h-16v-16h-16v16h-16v-16H86v-16h-8v-8h-8v-8h-8v-8H46v-8h-8v-16h16v-8h8v-8h8v-8h8v-8h8v-8h8v-8h8v-8h12z" fill="url(#gemini-body-gradient-base)"/><g clip-path="url(#gemini-body-clip-base)"><path d="M94 88h68v16h16v16h-40v8h-36v-8H78v-16h16z" fill="#4d83f5" opacity="0.36"/><path d="M62 128h40v-8h36v8h40v-8h20v24h-36v8h-36v-8H86v8H62z" fill="#bd65ea" opacity="0.34"/><path d="M54 160h32v-8h32v8h44v-8h32v32h-28v16H86v-16H62z" fill="#ff70ae" opacity="0.34"/></g></g>
            <g id="effect-js" clip-path="url(#gemini-body-clip-base)" opacity="0.42"><path d="M70 112h36v-8h28v8h32v8h-40v8H94v-8H70z" fill="#77a1ff"/><path d="M62 144h28v-8h36v8h32v-8h36v16h-36v8h-36v-8H86v8H62z" fill="#d77aec" opacity="0.58"/></g>
            <g id="eyes-js" fill="#080b16"><g id="idle-look-gaze-js"><g id="blink-js"><rect x="96" y="140" width="14" height="24"/><rect x="146" y="140" width="14" height="24"/></g></g></g><path id="mouth-js" d="M116 164h8v6h12v-6h8v6h-4v7h-20v-7h-4z" fill="#080b16"/>
          </g></g></g>
        </svg>
      </div>
      <div id="pointer-capture" class="tracking-capture" aria-hidden="true"><span id="tracking-top-left" class="tracking-hitbox tracking-hitbox--top-left"></span><span id="tracking-top" class="tracking-hitbox tracking-hitbox--top"></span><span id="tracking-top-right" class="tracking-hitbox tracking-hitbox--top-right"></span><span id="tracking-left" class="tracking-hitbox tracking-hitbox--left"></span><span id="tracking-center" class="tracking-hitbox tracking-hitbox--center"></span><span id="tracking-right" class="tracking-hitbox tracking-hitbox--right"></span><span id="tracking-bottom-left" class="tracking-hitbox tracking-hitbox--bottom-left"></span><span id="tracking-bottom" class="tracking-hitbox tracking-hitbox--bottom"></span><span id="tracking-bottom-right" class="tracking-hitbox tracking-hitbox--bottom-right"></span></div>
    </div>
    <div id="status" role="status">SVG 已载入 · 播放中 · 128px · 已完成 0 个循环</div>
  </main>
  <script>
    (()=>{
      const stage=document.getElementById('stage'),petObject=document.getElementById('pet-object'),pointerCapture=document.getElementById('pointer-capture'),status=document.getElementById('status'),svgRoot=petObject.querySelector('svg');
      const state={loaded:true,playing:true,size:128,background:'transparent',loopCount:0,errors:[]};
      const C={fullScaleStageRatioX:.30,fullScaleStageRatioY:.30,bodyMaxX:16,bodyMaxY:12,bodyMaxTilt:3,eyeMaxX:3,eyeMaxY:3,shadowMaxX:12,shadowMaxY:5,shadowStretchAmount:.08,smoothingCoefficient:.20,returnDelayMs:650,returnSettleThreshold:.001};
      let currentX=0,currentY=0,targetX=0,targetY=0,lastFrameAt=0,lastInputAt=0,returnStartedAt=0,centeredAt=0,returnTimer=0,trackingFrame=0;
      const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
      function updateStatus(){status.textContent=`SVG 已载入 · ${state.playing?'播放中':'已暂停'} · ${state.size}px · 已完成 ${state.loopCount} 个循环`;}
      function writePointerValues(x,y){const distance=Math.min(1,Math.hypot(x,y)),bodyX=x*C.bodyMaxX,bodyY=y*C.bodyMaxY,bodyTilt=x*C.bodyMaxTilt,eyeX=x*C.eyeMaxX,eyeY=y*C.eyeMaxY,shadowX=-x*C.shadowMaxX,shadowY=-y*C.shadowMaxY,shadowStretch=1+distance*C.shadowStretchAmount,s=state.size/256;svgRoot.style.setProperty('--body-x',`${bodyX.toFixed(2)}px`);svgRoot.style.setProperty('--body-y',`${bodyY.toFixed(2)}px`);svgRoot.style.setProperty('--body-tilt',`${bodyTilt.toFixed(2)}deg`);svgRoot.style.setProperty('--eye-x',`${eyeX.toFixed(2)}px`);svgRoot.style.setProperty('--eye-y',`${eyeY.toFixed(2)}px`);svgRoot.style.setProperty('--shadow-x',`${shadowX.toFixed(2)}px`);svgRoot.style.setProperty('--shadow-y',`${shadowY.toFixed(2)}px`);svgRoot.style.setProperty('--shadow-stretch',shadowStretch.toFixed(3));petObject.dataset.pointerQa=JSON.stringify({normalizedX:+x.toFixed(4),normalizedY:+y.toFixed(4),targetX:+targetX.toFixed(4),targetY:+targetY.toFixed(4),bodyX:+bodyX.toFixed(2),bodyY:+bodyY.toFixed(2),bodyTilt:+bodyTilt.toFixed(2),eyeX:+eyeX.toFixed(2),eyeY:+eyeY.toFixed(2),shadowX:+shadowX.toFixed(2),shadowY:+shadowY.toFixed(2),shadowStretch:+shadowStretch.toFixed(3),visibleBodyX:+(bodyX*s).toFixed(2),visibleBodyY:+(bodyY*s).toFixed(2),visibleEyeX:+(eyeX*s).toFixed(2),visibleEyeY:+(eyeY*s).toFixed(2),visibleShadowX:+(shadowX*s).toFixed(2),visibleShadowY:+(shadowY*s).toFixed(2),lastInputAt,returnStartedAt,centeredAt,measuredWaitMs:returnStartedAt?Math.round(returnStartedAt-lastInputAt):null,measuredReturnMs:centeredAt&&returnStartedAt?Math.round(centeredAt-returnStartedAt):null});}
      function ensureFrame(){if(!trackingFrame)trackingFrame=requestAnimationFrame(tick);}
      function tick(now){trackingFrame=0;const elapsed=lastFrameAt?Math.min(50,Math.max(1,now-lastFrameAt)):1000/60,ratio=elapsed/(1000/60),alpha=1-Math.pow(1-C.smoothingCoefficient,ratio);lastFrameAt=now;currentX+=(targetX-currentX)*alpha;currentY+=(targetY-currentY)*alpha;const settled=Math.abs(targetX-currentX)<=C.returnSettleThreshold&&Math.abs(targetY-currentY)<=C.returnSettleThreshold;if(settled){currentX=targetX;currentY=targetY;lastFrameAt=0;if(targetX===0&&targetY===0&&returnStartedAt&&!centeredAt)centeredAt=performance.now();}writePointerValues(currentX,currentY);if(!settled)ensureFrame();}
      function beginReturn(){returnTimer=0;returnStartedAt=performance.now();centeredAt=0;targetX=0;targetY=0;ensureFrame();}
      function scheduleReturn(){clearTimeout(returnTimer);returnTimer=setTimeout(beginReturn,C.returnDelayMs);}
      function setPointerTarget(x,y){clearTimeout(returnTimer);targetX=clamp(x,-1,1);targetY=clamp(y,-1,1);lastInputAt=performance.now();returnStartedAt=0;centeredAt=0;ensureFrame();scheduleReturn();}
      function handlePointerMove(event){const sr=stage.getBoundingClientRect(),pr=petObject.getBoundingClientRect(),ox=pr.left+pr.width/2,oy=pr.top+pr.height/2;setPointerTarget((event.clientX-ox)/(sr.width*C.fullScaleStageRatioX),(event.clientY-oy)/(sr.height*C.fullScaleStageRatioY));}
      function setPlaying(value){state.playing=value;svgRoot.style.setProperty('--play-state',value?'running':'paused');svgRoot.classList.toggle('is-paused',!value);updateStatus();}
      function restart(){state.loopCount=0;state.playing=true;svgRoot.classList.remove('is-paused');svgRoot.classList.add('is-restarting');void svgRoot.getBoundingClientRect();requestAnimationFrame(()=>{svgRoot.classList.remove('is-restarting');svgRoot.style.setProperty('--play-state','running');updateStatus();});}
      function setSize(size){state.size=size;petObject.style.width=`${size}px`;petObject.style.height=`${size}px`;document.querySelectorAll('[data-size]').forEach(button=>button.setAttribute('aria-pressed',String(+button.dataset.size===size)));writePointerValues(currentX,currentY);updateStatus();}
      function setBackground(background){state.background=background;stage.dataset.background=background;document.querySelectorAll('button[data-background]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.background===background)));}
      const mainLayer=svgRoot.querySelector('#idle-look-pose-js');if(mainLayer){mainLayer.addEventListener('animationiteration',event=>{if(event.target===mainLayer&&event.animationName==='gemini-idle-look-pose'){state.loopCount++;updateStatus();}});}else{state.loaded=false;state.errors.push('缺少 idle-look-pose-js 动画图层');}
      pointerCapture.addEventListener('pointermove',handlePointerMove);pointerCapture.addEventListener('pointerdown',handlePointerMove);pointerCapture.addEventListener('pointerleave',scheduleReturn);document.getElementById('play-button').addEventListener('click',()=>setPlaying(true));document.getElementById('pause-button').addEventListener('click',()=>setPlaying(false));document.getElementById('restart-button').addEventListener('click',restart);document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>setSize(+button.dataset.size)));document.querySelectorAll('button[data-background]').forEach(button=>button.addEventListener('click',()=>setBackground(button.dataset.background)));window.addEventListener('error',event=>state.errors.push(event.message||'window error'));window.addEventListener('unhandledrejection',event=>state.errors.push(String(event.reason)));
      window.petQA={getState:()=>JSON.parse(JSON.stringify(state)),getConstants:()=>({...C}),setSize,setBackground,pause:()=>setPlaying(false),play:()=>setPlaying(true),restart,simulatePointer:setPointerTarget,resetPointer:beginReturn};writePointerValues(0,0);requestAnimationFrame(tick);updateStatus();
    })();
  </script>
</body>
</html>
