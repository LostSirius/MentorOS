<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok Idle SVG Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111521; color: #ecf0f6; }
    main { width: min(760px, calc(100vw - 32px)); }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 16px; color: #aeb8c8; font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .label { color: #aeb8c8; font-size: 12px; margin-left: 4px; }
    button { border: 1px solid #394153; border-radius: 7px; padding: 7px 10px; background: #202639; color: #f5f7fb; font: inherit; font-size: 13px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: #7bd7ff; background: #18506a; }
    .stage { position: relative; height: 360px; overflow: hidden; display: grid; place-items: center; border: 1px solid #303849; border-radius: 14px; }
    .stage[data-background="transparent"] { background-color: #f4f5f7; background-image: linear-gradient(45deg,#d4d7dd 25%,transparent 25%),linear-gradient(-45deg,#d4d7dd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d7dd 75%),linear-gradient(-45deg,transparent 75%,#d4d7dd 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    .stage[data-background="dark"] { background: #0d1220; }
    .stage[data-background="light"] { background: #eef2f8; }
    #pet-object { position: relative; z-index: 2; width: 128px; height: 128px; background: transparent; pointer-events: none; }
    #pet-object > svg { display: block; width: 100%; height: 100%; }
    .tracking-capture { position: absolute; inset: 0; z-index: 3; }
    .tracking-hitbox { position: absolute; width: 18px; height: 18px; opacity: 0; pointer-events: auto; }
    .tracking-hitbox--top-left { top: 0; left: 0; }
    .tracking-hitbox--top-right { top: 0; right: 0; }
    .tracking-hitbox--bottom-left { bottom: 0; left: 0; }
    .tracking-hitbox--bottom-right { bottom: 0; right: 0; }
    .tracking-hitbox--top { top: 0; left: 50%; transform: translateX(-50%); }
    .tracking-hitbox--bottom { bottom: 0; left: 50%; transform: translateX(-50%); }
    .tracking-hitbox--left { left: 0; top: 50%; transform: translateY(-50%); }
    .tracking-hitbox--right { right: 0; top: 50%; transform: translateY(-50%); }
    .tracking-hitbox--center { top: 50%; left: 50%; transform: translate(-50%,-50%); }
    #status { min-height: 22px; margin-top: 12px; color: #aeb8c8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Grok · idle</h1>
    <p>微重力宇航员待机、白色闪电呼吸与鼠标追踪验证。</p>
    <div class="controls" aria-label="预览控制">
      <span class="label">播放</span>
      <button id="play-button" type="button">播放</button>
      <button id="pause-button" type="button">暂停</button>
      <button id="restart-button" type="button">重新开始</button>
      <span class="label">尺寸</span>
      <button type="button" data-size="64">64px</button>
      <button type="button" data-size="96">96px</button>
      <button type="button" data-size="128" aria-pressed="true">128px</button>
      <span class="label">背景</span>
      <button type="button" data-background="transparent" aria-pressed="true">透明</button>
      <button type="button" data-background="dark">深色</button>
      <button type="button" data-background="light">浅色</button>
    </div>
    <div id="stage" class="stage" data-background="transparent" data-testid="preview-stage">
      <div id="pet-object" role="img" aria-label="Grok idle 动画">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" preserveAspectRatio="xMidYMid meet" style="background-color:transparent;--eye-x:0px;--eye-y:0px;--body-x:0px;--body-y:0px;--body-tilt:0deg;--shadow-x:0px;--shadow-y:0px;--shadow-stretch:1;--play-state:running">
          <defs>
            <path id="grok-bolt-shape-idle" d="M144 158h18l-18 18h14l-40 40h-20l18-18h-14z"/>
            <style>
              #pointer-body-js { transform: translate(var(--body-x), var(--body-y)) rotate(var(--body-tilt)); transform-box: view-box; transform-origin: 128px 164px; }
              #float-js { animation: grok-idle-float 4000ms cubic-bezier(0.45, 0, 0.55, 1) infinite; animation-play-state: var(--play-state); transform-box: view-box; transform-origin: 128px 164px; }
              #head-js { animation: grok-idle-helmet-balance 4000ms cubic-bezier(0.45, 0, 0.55, 1) infinite; animation-play-state: var(--play-state); transform-box: view-box; transform-origin: 128px 140px; }
              #eyes-js { transform: translate(var(--eye-x), var(--eye-y)); }
              #blink-js { animation: grok-idle-blink 4000ms linear infinite; animation-play-state: var(--play-state); transform-box: fill-box; transform-origin: center; }
              #shadow-js { transform: translate(var(--shadow-x), var(--shadow-y)) scaleX(var(--shadow-stretch)); transform-box: view-box; transform-origin: 128px 241px; }
              #shadow-pulse-js { animation: grok-idle-shadow 4000ms cubic-bezier(0.45, 0, 0.55, 1) infinite; animation-play-state: var(--play-state); transform-box: fill-box; transform-origin: center; }
              #bolt-js { animation: grok-idle-bolt 4000ms cubic-bezier(0.45, 0, 0.55, 1) infinite; animation-play-state: var(--play-state); }
              .is-paused * { animation-play-state: paused !important; }
              .is-restarting * { animation: none !important; }
              @keyframes grok-idle-float {
                0% { transform: translateY(0px); }
                20% { transform: translateY(-5px); }
                40% { transform: translateY(-10px); }
                60% { transform: translateY(-5px); }
                76% { transform: translateY(1px); }
                79% { transform: translateY(3px); }
                82% { transform: translateY(1px); }
                100% { transform: translateY(0px); }
              }
              @keyframes grok-idle-helmet-balance {
                0% { transform: rotate(0deg); }
                20% { transform: rotate(0.20deg); }
                40% { transform: rotate(0.38deg); }
                60% { transform: rotate(0.16deg); }
                76% { transform: rotate(-0.10deg); }
                79% { transform: rotate(-0.24deg); }
                82% { transform: rotate(-0.08deg); }
                100% { transform: rotate(0deg); }
              }
              @keyframes grok-idle-shadow {
                0% { transform: scaleX(1); opacity: 0.22; }
                20% { transform: scaleX(0.91); opacity: 0.20; }
                40% { transform: scaleX(0.82); opacity: 0.17; }
                60% { transform: scaleX(0.91); opacity: 0.20; }
                76% { transform: scaleX(1.05); opacity: 0.23; }
                79% { transform: scaleX(1.10); opacity: 0.24; }
                82% { transform: scaleX(1.05); opacity: 0.23; }
                100% { transform: scaleX(1); opacity: 0.22; }
              }
              @keyframes grok-idle-blink {
                0% { transform: scaleY(1); }
                20% { transform: scaleY(1); }
                40% { transform: scaleY(1); }
                60% { transform: scaleY(1); }
                76% { transform: scaleY(0.62); }
                79% { transform: scaleY(0.08); }
                82% { transform: scaleY(1); }
                100% { transform: scaleY(1); }
              }
              @keyframes grok-idle-bolt {
                0% { fill:#e7e7e7; opacity:0.82; }
                20% { fill:#eeeeee; opacity:0.88; }
                40% { fill:#ffffff; opacity:1; }
                60% { fill:#f3f3f3; opacity:0.92; }
                76% { fill:#ebebeb; opacity:0.86; }
                79% { fill:#e7e7e7; opacity:0.82; }
                82% { fill:#ebebeb; opacity:0.84; }
                100% { fill:#e7e7e7; opacity:0.82; }
              }
            </style>
          </defs>
          <g id="shadow-js" opacity="0.22">
            <ellipse id="shadow-pulse-js" cx="128" cy="241" rx="48" ry="6" fill="#111217"/>
          </g>
          <g id="pointer-body-js" shape-rendering="crispEdges">
            <g id="float-js">
              <g id="body-js">
                <path d="M80 152h96v4h12v8h8v40h-8v8h-12v8h-16v8H96v-8H80v-8H68v-8h-8v-40h8v-8h12z" fill="#090a0c"/>
                <path d="M80 160h96v4h8v8h4v28h-8v8h-12v4h-16v8h-48v-8H88v-4H76v-8h-8v-28h4v-8h8z" fill="#1b1c20"/>
                <path d="M76 168h16v8h-8v20h8v8H76v-8h-8v-20h8zM164 168h16v8h8v20h-8v8h-16v-8h8v-20h-8z" fill="#28292e" opacity="0.68"/>
                <path d="M88 208h16v8h48v-8h16v8h-16v8h-48v-8H88z" fill="#25262b" opacity="0.68"/>
                <path d="M88 216h24v12H88zM144 216h24v12h-24z" fill="#08090b"/>
                <path d="M92 216h16v8H92zM148 216h16v8h-16z" fill="#d9d9d9"/>
                <path d="M92 216h16v4H92zM148 216h16v4h-16z" fill="#ffffff" opacity="0.72"/>
              </g>
              <g id="arms-js">
                <path d="M60 164h12v8h4v28h-4v8H60v-8h-8v-28h8z" fill="#090a0c"/>
                <path d="M56 176h12v8h4v16h-4v8H56v-8h-8v-16h8z" fill="#f4f4f4"/>
                <path d="M52 184h12v16H52zM56 200h8v8h-8z" fill="#d5d5d5"/>
                <path d="M196 164h-12v8h-4v28h4v8h12v-8h8v-28h-8z" fill="#090a0c"/>
                <path d="M200 176h-12v8h-4v16h4v8h12v-8h8v-16h-8z" fill="#f4f4f4"/>
                <path d="M192 184h12v16h-12zM192 200h8v8h-8z" fill="#d5d5d5"/>
              </g>
              <g id="head-js">
                <path d="M84 100h88v4h8v8h8v12h4v28h-4v8h-8v4h-8v4H84v-4h-8v-4h-8v-8h-4v-28h4v-12h8v-8h8z" fill="#08090b"/>
                <path d="M88 104h80v4h8v8h8v12h4v24h-4v8h-8v4h-8v4H88v-4h-8v-4h-8v-8h-4v-24h4v-12h8v-8h8z" fill="#f6f6f6"/>
                <path d="M92 108h72v4h8v8h8v12h4v24h-4v8h-8v4h-8v4H92v-4h-8v-4h-8v-8h-4v-24h4v-12h8v-8h8z" fill="#d8d8d8" opacity="0.62"/>
                <path d="M92 112h72v4h8v8h8v12h4v20h-4v8h-8v4H92v-4h-8v-8h-4v-20h4v-12h8z" fill="#0b0c0e"/>
                <path d="M92 112h72v4h8v8h8v8h-8v-8h-8v-4H96v4h-8v8h-8v-8h4v-12h8z" fill="#ffffff" opacity="0.34"/>
                <path d="M68 124h8v-8h8v44h-8v-8h-8zM180 124h8v-8h8v44h-8v-8h-8z" fill="#08090b"/>
                <path d="M68 132h8v24h-8zM180 132h8v24h-8z" fill="#f4f4f4"/>
                <path d="M68 136h4v20h-4zM184 136h4v20h-4z" fill="#d4d4d4"/>
                <path id="mouth-js" d="M120 150h16v5h-16z" fill="#f6f6f6"/>
              </g>
              <g id="eyes-js" fill="#f8f8f8">
                <g id="blink-js">
                  <rect x="96" y="130" width="12" height="18"/>
                  <rect x="148" y="130" width="12" height="18"/>
                </g>
              </g>
              <g id="accessory-js">
                <use id="bolt-js" href="#grok-bolt-shape-idle" fill="#eeeeee"/>
              </g>
              <g id="effect-js">
                <path d="M116 28h8v6h6v8h-6v6h-8v-6h-6v-8h6z" fill="#f8f8f8"/>
                <path d="M156 46h8v6h6v8h-6v6h-8v-6h-6v-8h6z" fill="#23bff0"/>
                <path d="M124 68h8v6h6v8h-6v6h-8v-6h-6v-8h6z" fill="#ffe56a"/>
              </g>
            </g>
          </g>
        </svg>
      </div>
      <div id="pointer-capture" class="tracking-capture" aria-hidden="true">
        <span id="tracking-top-left" class="tracking-hitbox tracking-hitbox--top-left"></span>
        <span id="tracking-top-right" class="tracking-hitbox tracking-hitbox--top-right"></span>
        <span id="tracking-bottom-left" class="tracking-hitbox tracking-hitbox--bottom-left"></span>
        <span id="tracking-bottom-right" class="tracking-hitbox tracking-hitbox--bottom-right"></span>
        <span id="tracking-top" class="tracking-hitbox tracking-hitbox--top"></span>
        <span id="tracking-bottom" class="tracking-hitbox tracking-hitbox--bottom"></span>
        <span id="tracking-left" class="tracking-hitbox tracking-hitbox--left"></span>
        <span id="tracking-right" class="tracking-hitbox tracking-hitbox--right"></span>
        <span id="tracking-center" class="tracking-hitbox tracking-hitbox--center"></span>
      </div>
    </div>
    <div id="status" role="status">正在载入 SVG…</div>
  </main>
  <script>
    (() => {
      const stage = document.getElementById('stage');
      const petObject = document.getElementById('pet-object');
      const pointerCapture = document.getElementById('pointer-capture');
      const status = document.getElementById('status');
      const state = { loaded: false, playing: true, size: 128, background: 'transparent', loopCount: 0, errors: [] };
      const POINTER_CONFIG = {
        fullScaleStageRatioX: 0.30,
        fullScaleStageRatioY: 0.30,
        bodyMaxX: 16,
        bodyMaxY: 12,
        bodyMaxTilt: 3,
        eyeMax: 3,
        shadowMaxX: 12,
        shadowMaxY: 5,
        shadowMaxStretch: 1.08,
        smoothingCoefficient: 0.20,
        returnDelayMs: 650,
        returnSettleThreshold: 0.003,
        expectedReturnDurationMs: 500
      };
      let svgRoot = null;
      let currentX = 0, currentY = 0, targetX = 0, targetY = 0;
      let lastFrameAt = performance.now(), lastInputAt = performance.now();
      let returnTimer = 0, settleTimer = 0, returnStartedAt = 0, centeredAt = 0;

      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
      function updateStatus() {
        const loadState = state.loaded ? 'SVG 已载入' : '正在载入 SVG';
        const playback = state.playing ? '播放中' : '已暂停';
        status.textContent = `${loadState} · ${playback} · ${state.size}px · 已完成 ${state.loopCount} 个循环`;
      }
      function writePointerValues(x, y) {
        if (!svgRoot) return;
        svgRoot.style.setProperty('--body-x', `${(x * POINTER_CONFIG.bodyMaxX).toFixed(2)}px`);
        svgRoot.style.setProperty('--body-y', `${(y * POINTER_CONFIG.bodyMaxY).toFixed(2)}px`);
        svgRoot.style.setProperty('--body-tilt', `${(x * POINTER_CONFIG.bodyMaxTilt).toFixed(2)}deg`);
        svgRoot.style.setProperty('--eye-x', `${(x * POINTER_CONFIG.eyeMax).toFixed(2)}px`);
        svgRoot.style.setProperty('--eye-y', `${(y * POINTER_CONFIG.eyeMax).toFixed(2)}px`);
        svgRoot.style.setProperty('--shadow-x', `${(-x * POINTER_CONFIG.shadowMaxX).toFixed(2)}px`);
        svgRoot.style.setProperty('--shadow-y', `${(-y * POINTER_CONFIG.shadowMaxY).toFixed(2)}px`);
        svgRoot.style.setProperty('--shadow-stretch', (1 + Math.abs(x) * (POINTER_CONFIG.shadowMaxStretch - 1)).toFixed(3));
        const visibleScale = state.size / 256;
        petObject.dataset.pointerQa = JSON.stringify({
          normalizedX: Number(x.toFixed(4)), normalizedY: Number(y.toFixed(4)),
          targetX: Number(targetX.toFixed(4)), targetY: Number(targetY.toFixed(4)),
          bodyX: (x * POINTER_CONFIG.bodyMaxX).toFixed(2), bodyY: (y * POINTER_CONFIG.bodyMaxY).toFixed(2), bodyTilt: (x * POINTER_CONFIG.bodyMaxTilt).toFixed(2),
          eyeX: (x * POINTER_CONFIG.eyeMax).toFixed(2), eyeY: (y * POINTER_CONFIG.eyeMax).toFixed(2),
          shadowX: (-x * POINTER_CONFIG.shadowMaxX).toFixed(2), shadowY: (-y * POINTER_CONFIG.shadowMaxY).toFixed(2), shadowStretch: (1 + Math.abs(x) * (POINTER_CONFIG.shadowMaxStretch - 1)).toFixed(3),
          visibleBodyX: (x * POINTER_CONFIG.bodyMaxX * visibleScale).toFixed(2), visibleBodyY: (y * POINTER_CONFIG.bodyMaxY * visibleScale).toFixed(2),
          visibleEyeX: (x * POINTER_CONFIG.eyeMax * visibleScale).toFixed(2), visibleEyeY: (y * POINTER_CONFIG.eyeMax * visibleScale).toFixed(2),
          visibleShadowX: (-x * POINTER_CONFIG.shadowMaxX * visibleScale).toFixed(2), visibleShadowY: (-y * POINTER_CONFIG.shadowMaxY * visibleScale).toFixed(2),
          lastInputAt, returnStartedAt, centeredAt,
          measuredWaitMs: returnStartedAt ? Math.round(returnStartedAt - lastInputAt) : null,
          measuredReturnMs: centeredAt && returnStartedAt ? Math.round(centeredAt - returnStartedAt) : null
        });
      }
      function tick(now) {
        const frameRatio = clamp((now - lastFrameAt) / (1000 / 60), 0.5, 6);
        const alpha = 1 - Math.pow(1 - POINTER_CONFIG.smoothingCoefficient, frameRatio);
        currentX += (targetX - currentX) * alpha;
        currentY += (targetY - currentY) * alpha;
        if (returnStartedAt && !centeredAt && Math.abs(currentX) < POINTER_CONFIG.returnSettleThreshold && Math.abs(currentY) < POINTER_CONFIG.returnSettleThreshold) {
          currentX = 0; currentY = 0; centeredAt = now;
          if (settleTimer) { window.clearTimeout(settleTimer); settleTimer = 0; }
        }
        writePointerValues(currentX, currentY);
        lastFrameAt = now;
        requestAnimationFrame(tick);
      }
      function beginReturnToCenter() {
        returnTimer = 0;
        returnStartedAt = performance.now();
        centeredAt = 0;
        targetX = 0; targetY = 0;
        if (settleTimer) window.clearTimeout(settleTimer);
        settleTimer = window.setTimeout(() => {
          if (!returnStartedAt || targetX !== 0 || targetY !== 0) return;
          currentX = 0; currentY = 0; centeredAt = performance.now();
          writePointerValues(currentX, currentY);
          settleTimer = 0;
        }, POINTER_CONFIG.expectedReturnDurationMs);
      }
      function scheduleReturnToCenter() {
        if (returnTimer) window.clearTimeout(returnTimer);
        returnTimer = window.setTimeout(beginReturnToCenter, POINTER_CONFIG.returnDelayMs);
      }
      function setPointerTarget(x, y) {
        if (returnTimer) { window.clearTimeout(returnTimer); returnTimer = 0; }
        if (settleTimer) { window.clearTimeout(settleTimer); settleTimer = 0; }
        returnStartedAt = 0; centeredAt = 0;
        targetX = clamp(x, -1, 1); targetY = clamp(y, -1, 1);
        lastInputAt = performance.now();
        scheduleReturnToCenter();
      }
      function handlePointerMove(event) {
        const stageRect = stage.getBoundingClientRect();
        const petRect = petObject.getBoundingClientRect();
        const originX = petRect.left + petRect.width / 2;
        const originY = petRect.top + petRect.height / 2;
        const fullScaleDistanceX = stageRect.width * POINTER_CONFIG.fullScaleStageRatioX;
        const fullScaleDistanceY = stageRect.height * POINTER_CONFIG.fullScaleStageRatioY;
        setPointerTarget((event.clientX - originX) / fullScaleDistanceX, (event.clientY - originY) / fullScaleDistanceY);
      }
      function setPlaying(playing) {
        state.playing = playing;
        if (svgRoot) svgRoot.style.setProperty('--play-state', playing ? 'running' : 'paused');
        updateStatus();
      }
      function restart() {
        if (!svgRoot) return;
        state.loopCount = 0;
        svgRoot.classList.add('is-restarting');
        window.setTimeout(() => svgRoot.classList.remove('is-restarting'), 30);
        svgRoot.style.setProperty('--play-state', state.playing ? 'running' : 'paused');
        updateStatus();
      }
      function setSize(size) {
        state.size = size;
        petObject.style.width = `${size}px`;
        petObject.style.height = `${size}px`;
        document.querySelectorAll('[data-size]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.size) === size)));
        writePointerValues(currentX, currentY);
        updateStatus();
      }
      function setBackground(background) {
        state.background = background;
        stage.dataset.background = background;
        document.querySelectorAll('[data-background]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.background === background)));
      }
      function handleSvgLoad() {
        const documentRoot = petObject.querySelector('svg');
        if (!documentRoot || documentRoot === svgRoot) return;
        svgRoot = documentRoot;
        state.loaded = true;
        svgRoot.style.setProperty('--play-state', state.playing ? 'running' : 'paused');
        const floatLayer = svgRoot.querySelector('#float-js');
        if (floatLayer) {
          floatLayer.addEventListener('animationiteration', event => {
            if (event.target !== floatLayer || event.animationName !== 'grok-idle-float') return;
            state.loopCount += 1;
            updateStatus();
          });
        } else { state.errors.push('缺少 float-js 动画图层'); }
        writePointerValues(0, 0);
        updateStatus();
      }
      pointerCapture.addEventListener('pointermove', handlePointerMove);
      pointerCapture.addEventListener('pointerdown', handlePointerMove);
      pointerCapture.addEventListener('pointerleave', scheduleReturnToCenter);
      document.getElementById('play-button').addEventListener('click', () => setPlaying(true));
      document.getElementById('pause-button').addEventListener('click', () => setPlaying(false));
      document.getElementById('restart-button').addEventListener('click', restart);
      document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => setSize(Number(button.dataset.size))));
      document.querySelectorAll('[data-background]').forEach(button => button.addEventListener('click', () => setBackground(button.dataset.background)));
      window.addEventListener('error', event => state.errors.push(event.message || 'window error'));
      window.addEventListener('unhandledrejection', event => state.errors.push(String(event.reason)));
      window.petQA = { getState: () => JSON.parse(JSON.stringify(state)), setSize, setBackground, pause: () => setPlaying(false), play: () => setPlaying(true), restart, simulatePointer: setPointerTarget, resetPointer: beginReturnToCenter };
      handleSvgLoad();
      requestAnimationFrame(tick);
      updateStatus();
    })();
  </script>
</body>
</html>
