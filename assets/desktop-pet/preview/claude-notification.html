<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claude notification Preview</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#11151d;color:#e8edf5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(760px,100%)}
    h1{margin:0 0 6px;font-size:24px}p{margin:0 0 16px;color:#aeb8c8}
    .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.label{margin-left:8px;color:#9aa6b8;font-size:13px}
    button{border:1px solid #465166;border-radius:8px;background:#202735;color:#edf3ff;padding:7px 10px;cursor:pointer}
    button[aria-pressed="true"]{border-color:#a878ef;background:#3c2855}.stage{position:relative;height:360px;overflow:hidden;display:grid;place-items:center;border:1px solid #303849;border-radius:14px}
    .stage[data-background="transparent"]{background-color:#f4f5f7;background-image:linear-gradient(45deg,#d4d7dd 25%,transparent 25%),linear-gradient(-45deg,#d4d7dd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d7dd 75%),linear-gradient(-45deg,transparent 75%,#d4d7dd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
    .stage[data-background="dark"]{background:#0d1220}.stage[data-background="light"]{background:#eef2f8}
    #pet-object{position:relative;z-index:2;width:128px;height:128px;background:transparent;pointer-events:none}#pet-object>svg{display:block;width:100%;height:100%;overflow:visible}
    #pointer-capture{position:absolute;inset:0;z-index:3}.tracking-hitbox{position:absolute;width:18px;height:18px;opacity:0;pointer-events:auto}
    .tl{top:0;left:0}.tr{top:0;right:0}.bl{bottom:0;left:0}.br{bottom:0;right:0}.top{top:0;left:50%;transform:translateX(-50%)}.bottom{bottom:0;left:50%;transform:translateX(-50%)}.left{left:0;top:50%;transform:translateY(-50%)}.right{right:0;top:50%;transform:translateY(-50%)}.center{top:50%;left:50%;transform:translate(-50%,-50%)}
    #status{min-height:22px;margin-top:12px;color:#aeb8c8;font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>Claude · notification</h1>
    <p>Two clear front-loaded reminders using only the original body and parts: a strong pulse, a weaker pulse, then a long quiet baseline hold.</p>

      <span class="label">Animation</span><button id="play-button" type="button">Play</button><button id="pause-button" type="button">Pause</button><button id="restart-button" type="button">Restart</button>
      <span class="label">Size</span><button type="button" data-size="64">64px</button><button type="button" data-size="96">96px</button><button type="button" data-size="128" aria-pressed="true">128px</button>
      <span class="label">Background</span><button type="button" data-background="transparent" aria-pressed="true">Transparent</button><button type="button" data-background="dark">Dark</button><button type="button" data-background="light">Light</button>
    </div>

              @keyframes claude-notification-left-arm{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(-3px,-2px) rotate(-5deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(-2px,-1px) rotate(-3deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
              @keyframes claude-notification-right-arm{0%{transform:translate(0px,0px) rotate(0deg)}8%{transform:translate(3px,-2px) rotate(5deg)}16%{transform:translate(0px,0px) rotate(0deg)}26%{transform:translate(2px,-1px) rotate(3deg)}36%{transform:translate(0px,0px) rotate(0deg)}40%{transform:translate(0px,0px) rotate(0deg)}70%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
              @keyframes claude-notification-gaze{0%{transform:translate(0px,0px)}8%{transform:translate(0px,-1px)}16%{transform:translate(0px,0px)}26%{transform:translate(0px,-0.6px)}36%{transform:translate(0px,0px)}40%{transform:translate(0px,0px)}70%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
              @keyframes claude-notification-emblem{0%{transform:rotate(0deg)}8%{transform:rotate(5deg)}16%{transform:rotate(0deg)}26%{transform:rotate(3deg)}36%{transform:rotate(0deg)}40%{transform:rotate(0deg)}70%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}
              @keyframes claude-notification-blink{0%{transform:scaleY(1)}8%{transform:scaleY(1)}16%{transform:scaleY(1)}26%{transform:scaleY(1)}36%{transform:scaleY(1)}40%{transform:scaleY(1)}70%{transform:scaleY(1)}100%{transform:scaleY(1)}}
              @keyframes claude-notification-shadow{0%{transform:scaleX(1)}8%{transform:scaleX(0.92)}16%{transform:scaleX(1)}26%{transform:scaleX(0.96)}36%{transform:scaleX(1)}40%{transform:scaleX(1)}70%{transform:scaleX(1)}100%{transform:scaleX(1)}}
            </style>

  <script>
    (() => {
      const stage=document.getElementById('stage'),petObject=document.getElementById('pet-object'),pointerCapture=document.getElementById('pointer-capture'),status=document.getElementById('status'),svgRoot=petObject.querySelector('svg');
      const state={loaded:false,playing:true,size:128,background:'transparent',loopCount:0,errors:[],warnings:[]};
      const nativeConsoleError=console.error.bind(console),nativeConsoleWarn=console.warn.bind(console);console.error=(...args)=>{state.errors.push(args.map(String).join(' '));nativeConsoleError(...args);updateStatus();};console.warn=(...args)=>{state.warnings.push(args.map(String).join(' '));nativeConsoleWarn(...args);updateStatus();};
      const C={fullScaleStageRatioX:.30,fullScaleStageRatioY:.30,bodyMaxX:16,bodyMaxY:12,bodyMaxTilt:3,eyeMax:3,shadowMaxX:12,shadowMaxY:5,shadowMaxStretch:1.08,smoothingCoefficient:.20,returnDelayMs:650,returnSettleThreshold:.003,expectedReturnDurationMs:500};
      let currentX=0,currentY=0,targetX=0,targetY=0,lastFrameAt=performance.now(),lastInputAt=performance.now(),returnTimer=0,settleTimer=0,returnStartedAt=0,centeredAt=0,rafId=0;
      const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
      const shadowDistance=x=>Math.abs(x);
      function updateStatus(){status.textContent=`SVG loaded · ${state.playing?'playing':'paused'} · ${state.size}px · ${state.loopCount} loops`;document.documentElement.dataset.qaState=JSON.stringify(state);}
      function writePointerValues(x,y){
        svgRoot.style.setProperty('--body-x',`${(x*C.bodyMaxX).toFixed(2)}px`);svgRoot.style.setProperty('--body-y',`${(y*C.bodyMaxY).toFixed(2)}px`);svgRoot.style.setProperty('--body-tilt',`${(x*C.bodyMaxTilt).toFixed(2)}deg`);
        svgRoot.style.setProperty('--eye-x',`${(x*C.eyeMax).toFixed(2)}px`);svgRoot.style.setProperty('--eye-y',`${(y*C.eyeMax).toFixed(2)}px`);
        svgRoot.style.setProperty('--shadow-x',`${(-x*C.shadowMaxX).toFixed(2)}px`);svgRoot.style.setProperty('--shadow-y',`${(-y*C.shadowMaxY).toFixed(2)}px`);svgRoot.style.setProperty('--shadow-stretch',(1+shadowDistance(x)*(C.shadowMaxStretch-1)).toFixed(3));
        const s=state.size/256;petObject.dataset.pointerQa=JSON.stringify({normalizedX:+x.toFixed(4),normalizedY:+y.toFixed(4),targetX:+targetX.toFixed(4),targetY:+targetY.toFixed(4),bodyX:+(x*C.bodyMaxX).toFixed(2),bodyY:+(y*C.bodyMaxY).toFixed(2),bodyTilt:+(x*C.bodyMaxTilt).toFixed(2),eyeX:+(x*C.eyeMax).toFixed(2),eyeY:+(y*C.eyeMax).toFixed(2),shadowX:+(-x*C.shadowMaxX).toFixed(2),shadowY:+(-y*C.shadowMaxY).toFixed(2),shadowStretch:+(1+shadowDistance(x)*(C.shadowMaxStretch-1)).toFixed(3),visibleBodyX:+(x*C.bodyMaxX*s).toFixed(2),visibleBodyY:+(y*C.bodyMaxY*s).toFixed(2),visibleEyeX:+(x*C.eyeMax*s).toFixed(2),visibleEyeY:+(y*C.eyeMax*s).toFixed(2),visibleShadowX:+(-x*C.shadowMaxX*s).toFixed(2),visibleShadowY:+(-y*C.shadowMaxY*s).toFixed(2),lastInputAt,returnStartedAt,centeredAt,measuredWaitMs:returnStartedAt?Math.round(returnStartedAt-lastInputAt):null,measuredReturnMs:centeredAt&&returnStartedAt?Math.round(centeredAt-returnStartedAt):null});
      }
      function tick(now){const ratio=clamp((now-lastFrameAt)/(1000/60),.5,6),alpha=1-Math.pow(1-C.smoothingCoefficient,ratio);currentX+=(targetX-currentX)*alpha;currentY+=(targetY-currentY)*alpha;if(returnStartedAt&&!centeredAt&&Math.abs(currentX)<C.returnSettleThreshold&&Math.abs(currentY)<C.returnSettleThreshold){currentX=0;currentY=0;centeredAt=now;if(settleTimer){clearTimeout(settleTimer);settleTimer=0}}writePointerValues(currentX,currentY);lastFrameAt=now;rafId=requestAnimationFrame(tick);}
      function ensureTick(){if(!rafId){lastFrameAt=performance.now();rafId=requestAnimationFrame(tick)}}
      function beginReturn(){returnTimer=0;returnStartedAt=performance.now();centeredAt=0;targetX=0;targetY=0;if(settleTimer)clearTimeout(settleTimer);settleTimer=setTimeout(()=>{if(returnStartedAt&&targetX===0&&targetY===0&&!centeredAt){currentX=0;currentY=0;centeredAt=performance.now();writePointerValues(0,0)}settleTimer=0},C.expectedReturnDurationMs);ensureTick();}
      function scheduleReturn(){if(returnTimer)clearTimeout(returnTimer);returnTimer=setTimeout(beginReturn,C.returnDelayMs);}
      function setPointerTarget(x,y){if(returnTimer){clearTimeout(returnTimer);returnTimer=0}if(settleTimer){clearTimeout(settleTimer);settleTimer=0}returnStartedAt=0;centeredAt=0;targetX=clamp(x,-1,1);targetY=clamp(y,-1,1);lastInputAt=performance.now();scheduleReturn();ensureTick();}
      function handlePointerMove(e){const sr=stage.getBoundingClientRect(),pr=petObject.getBoundingClientRect(),ox=pr.left+pr.width/2,oy=pr.top+pr.height/2;setPointerTarget((e.clientX-ox)/(sr.width*C.fullScaleStageRatioX),(e.clientY-oy)/(sr.height*C.fullScaleStageRatioY));}
      function setPlaying(v){state.playing=v;svgRoot.style.setProperty('--play-state',v?'running':'paused');updateStatus();}
      function restart(){state.loopCount=0;svgRoot.classList.add('is-restarting');void svgRoot.getBoundingClientRect();requestAnimationFrame(()=>{svgRoot.classList.remove('is-restarting');svgRoot.style.setProperty('--play-state',state.playing?'running':'paused')});updateStatus();}
      function setSize(size){state.size=size;petObject.style.width=`${size}px`;petObject.style.height=`${size}px`;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===size)));writePointerValues(currentX,currentY);updateStatus();}
      function setBackground(bg){state.background=bg;stage.dataset.background=bg;document.querySelectorAll('[data-background]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.background===bg)));updateStatus();}
      const required=["pointer-body-js","float-js","notification-pose-js","eyes-js","gaze-js","left-eye-js","right-eye-js","blink-js","top-tuft-js","left-arm-js","right-arm-js","emblem-js","shadow-js","shadow-pulse-js"];for(const id of required)if(!svgRoot.querySelector('#'+id))state.errors.push('Missing '+id);
      const loopLayer=svgRoot.querySelector('#notification-pose-js');if(loopLayer){loopLayer.addEventListener('animationiteration',e=>{if(e.target===loopLayer&&e.animationName==='claude-notification-pose'){state.loopCount++;updateStatus()}});state.loaded=true;}
      pointerCapture.addEventListener('pointermove',handlePointerMove);pointerCapture.addEventListener('pointerdown',handlePointerMove);pointerCapture.addEventListener('pointerleave',scheduleReturn);
      document.getElementById('play-button').addEventListener('click',()=>setPlaying(true));document.getElementById('pause-button').addEventListener('click',()=>setPlaying(false));document.getElementById('restart-button').addEventListener('click',restart);
      document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>setSize(+b.dataset.size)));document.querySelectorAll('[data-background]').forEach(b=>b.addEventListener('click',()=>setBackground(b.dataset.background)));
      window.addEventListener('error',e=>{state.errors.push(e.message||'window error');updateStatus()});window.addEventListener('unhandledrejection',e=>{state.errors.push(String(e.reason));updateStatus()});
      window.petQA={getState:()=>JSON.parse(JSON.stringify(state)),getPointer:()=>JSON.parse(petObject.dataset.pointerQa||'{}'),setSize,setBackground,pause:()=>setPlaying(false),play:()=>setPlaying(true),restart,simulatePointer:setPointerTarget,resetPointer:beginReturn};
      writePointerValues(0,0);rafId=requestAnimationFrame(tick);updateStatus();
    })();
