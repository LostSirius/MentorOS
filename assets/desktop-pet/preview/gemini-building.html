<script>
(()=>{const stage=document.getElementById('stage'),pet=document.getElementById('pet-object'),capture=document.getElementById('pointer-capture'),status=document.getElementById('status'),svg=pet.querySelector('svg');const state={loaded:true,playing:true,size:128,background:'transparent',loopCount:0,errors:[]},C={fullScaleStageRatioX:.3,fullScaleStageRatioY:.3,bodyMaxX:16,bodyMaxY:12,bodyMaxTilt:3,eyeMaxX:3,eyeMaxY:3,shadowMaxX:12,shadowMaxY:5,shadowStretchAmount:.08,smoothingCoefficient:.2,returnDelayMs:650,returnSettleThreshold:.001};let cx=0,cy=0,tx=0,ty=0,lastFrame=0,lastInputAt=0,returnStartedAt=0,centeredAt=0,timer=0,frame=0;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));function update(){status.textContent=`SVG loaded · ${state.playing?'playing':'paused'} · ${state.size}px · ${state.loopCount} loops`}function write(x,y){const d=Math.min(1,Math.hypot(x,y)),bx=x*C.bodyMaxX,by=y*C.bodyMaxY,bt=x*C.bodyMaxTilt,ex=x*C.eyeMaxX,ey=y*C.eyeMaxY,sx=-x*C.shadowMaxX,sy=-y*C.shadowMaxY,ss=1+d*C.shadowStretchAmount,k=state.size/256;svg.style.setProperty('--body-x',`${bx.toFixed(2)}px`);svg.style.setProperty('--body-y',`${by.toFixed(2)}px`);svg.style.setProperty('--body-tilt',`${bt.toFixed(2)}deg`);svg.style.setProperty('--eye-x',`${ex.toFixed(2)}px`);svg.style.setProperty('--eye-y',`${ey.toFixed(2)}px`);svg.style.setProperty('--shadow-x',`${sx.toFixed(2)}px`);svg.style.setProperty('--shadow-y',`${sy.toFixed(2)}px`);svg.style.setProperty('--shadow-stretch',ss.toFixed(3));pet.dataset.pointerQa=JSON.stringify({normalizedX:+x.toFixed(4),normalizedY:+y.toFixed(4),targetX:+tx.toFixed(4),targetY:+ty.toFixed(4),bodyX:+bx.toFixed(2),bodyY:+by.toFixed(2),bodyTilt:+bt.toFixed(2),eyeX:+ex.toFixed(2),eyeY:+ey.toFixed(2),shadowX:+sx.toFixed(2),shadowY:+sy.toFixed(2),shadowStretch:+ss.toFixed(3),visibleBodyX:+(bx*k).toFixed(2),visibleBodyY:+(by*k).toFixed(2),lastInputAt,returnStartedAt,centeredAt,measuredWaitMs:returnStartedAt?Math.round(returnStartedAt-lastInputAt):null,measuredReturnMs:centeredAt&&returnStartedAt?Math.round(centeredAt-returnStartedAt):null})}function ensure(){if(!frame)frame=requestAnimationFrame(tick)}function tick(now){frame=0;const e=lastFrame?Math.min(50,Math.max(1,now-lastFrame)):1000/60,a=1-Math.pow(1-C.smoothingCoefficient,e/(1000/60));lastFrame=now;cx+=(tx-cx)*a;cy+=(ty-cy)*a;const done=Math.abs(tx-cx)<=C.returnSettleThreshold&&Math.abs(ty-cy)<=C.returnSettleThreshold;if(done){cx=tx;cy=ty;lastFrame=0;if(!tx&&!ty&&returnStartedAt&&!centeredAt)centeredAt=performance.now()}write(cx,cy);if(!done)ensure()}function beginReturn(){timer=0;returnStartedAt=performance.now();centeredAt=0;tx=0;ty=0;ensure()}function schedule(){clearTimeout(timer);timer=setTimeout(beginReturn,C.returnDelayMs)}function target(x,y){clearTimeout(timer);tx=clamp(x,-1,1);ty=clamp(y,-1,1);lastInputAt=performance.now();returnStartedAt=0;centeredAt=0;ensure();schedule()}function pointer(e){const sr=stage.getBoundingClientRect(),pr=pet.getBoundingClientRect();target((e.clientX-(pr.left+pr.width/2))/(sr.width*C.fullScaleStageRatioX),(e.clientY-(pr.top+pr.height/2))/(sr.height*C.fullScaleStageRatioY))}function playing(v){state.playing=v;svg.style.setProperty('--play-state',v?'running':'paused');update()}function restart(){state.loopCount=0;state.playing=true;svg.classList.add('is-restarting');void svg.getBoundingClientRect();requestAnimationFrame(()=>{svg.classList.remove('is-restarting');svg.style.setProperty('--play-state','running');update()})}function size(v){state.size=v;pet.style.width=pet.style.height=`${v}px`;document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===v)));write(cx,cy);update()}function background(v){state.background=v;stage.dataset.background=v;document.querySelectorAll('[data-background]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.background===v)))}const main=svg.querySelector('#building-pose-js');main.addEventListener('animationiteration',e=>{if(e.target===main&&e.animationName==='gemini-building-pose'){state.loopCount++;update()}});capture.addEventListener('pointermove',pointer);capture.addEventListener('pointerdown',pointer);capture.addEventListener('pointerleave',schedule);document.getElementById('play-button').onclick=()=>playing(true);document.getElementById('pause-button').onclick=()=>playing(false);document.getElementById('restart-button').onclick=restart;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>size(+b.dataset.size));document.querySelectorAll('[data-background]').forEach(b=>b.onclick=()=>background(b.dataset.background));window.addEventListener('error',e=>state.errors.push(e.message||'window error'));window.addEventListener('unhandledrejection',e=>state.errors.push(String(e.reason)));window.petQA={getState:()=>JSON.parse(JSON.stringify(state)),getConstants:()=>({...C}),setSize:size,setBackground:background,pause:()=>playing(false),play:()=>playing(true),restart,simulatePointer:target,resetPointer:beginReturn};write(0,0);requestAnimationFrame(tick);update()})();
